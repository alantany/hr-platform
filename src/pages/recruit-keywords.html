<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>解析关键词配置矩阵</title>
  <link rel="stylesheet" href="../../styles.css?v=20260728-jd-profile" />
  <script defer src="../../frontend-api.js?v=20260728-jd-parse-fix"></script>
  <script defer src="../../app.js?v=20260728-kw-v3"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const PRESET_KEYWORDS = ["学历", "年龄", "证书", "行业", "岗位", "技能", "获奖情况", "工作年限"];

    let allKeywords = [];

    window.__PAGE_BODY__ = `
      <div class="recruit-keywords-page">
        <!-- 矩阵配置面板卡片 -->
        <section class="panel">
          <div class="section-head">
            <div>
              <h3>JD 解析关注关键词矩阵</h3>
              <div class="section-sub">勾选表示【启用该关键词】参与 AI 对 JD 的提取与过滤；取消勾选代表暂不关注。</div>
            </div>
            <div class="hero-actions">
              <span class="import-status-pill tone-primary" id="activeCountBadge">已勾选 0 个关键词</span>
            </div>
          </div>

          <!-- 极简一键快捷新增内联条 -->
          <form class="kw-inline-add-bar margin-top-md" id="inlineAddForm">
            <input 
              class="input kw-inline-input" 
              id="newKwInput" 
              placeholder="输入想要关注的新关键词（如：出差要求、语言能力、薪资期望）..." 
              required 
            />
            <button class="btn primary" type="submit">
              + 添加新关键词到矩阵
            </button>
          </form>

          <!-- 关键词矩阵勾选卡片网格 -->
          <div class="kw-matrix-grid margin-top-md" id="kwMatrixGrid">
            <div class="table-empty">
              <div class="table-empty-title">解析关键词矩阵加载中...</div>
            </div>
          </div>
        </section>
      </div>
    `;

    function renderMatrixGrid() {
      const grid = document.getElementById("kwMatrixGrid");
      const badge = document.getElementById("activeCountBadge");
      if (!grid) return;

      const activeCount = allKeywords.filter(k => k.is_active).length;
      if (badge) {
        badge.textContent = `已勾选 ${activeCount} / ${allKeywords.length} 个关注关键词`;
      }

      if (!allKeywords.length) {
        grid.innerHTML = `
          <div class="table-empty">
            <div class="table-empty-title">暂无关键词</div>
            <div class="table-empty-desc">请在上方输入框添加想要关注的解析关键词。</div>
          </div>
        `;
        return;
      }

      grid.innerHTML = allKeywords.map(item => `
        <label class="kw-matrix-card ${item.is_active ? 'is-checked' : ''}" data-id="${item.id}">
          <div class="kw-matrix-checkbox-wrap">
            <input 
              type="checkbox" 
              class="kw-matrix-checkbox" 
              data-action="toggle-kw-check" 
              data-id="${item.id}" 
              ${item.is_active ? 'checked' : ''} 
            />
            <span class="kw-matrix-label-text">${escapeHtml(item.keyword)}</span>
          </div>
          ${!PRESET_KEYWORDS.includes(item.keyword) ? `
            <button 
              type="button" 
              class="kw-matrix-del-btn" 
              data-action="delete-kw" 
              data-id="${item.id}" 
              title="删除该关键词"
            >✕</button>
          ` : `
            <span class="kw-matrix-preset-tag">预置</span>
          `}
        </label>
      `).join("");
    }

    async function loadData() {
      const res = await window.hrApi.recruitParseKeywords();
      allKeywords = res.keywords || [];
      renderMatrixGrid();
    }

    window.addEventListener("DOMContentLoaded", async () => {
      await renderApp();
      await loadData().catch(err => showToast(err.message || String(err)));

      // 切换勾选框
      document.getElementById("kwMatrixGrid")?.addEventListener("change", async (e) => {
        const checkbox = e.target.closest('[data-action="toggle-kw-check"]');
        if (!checkbox) return;
        const id = Number(checkbox.dataset.id);
        const newActive = checkbox.checked;
        
        // 界面先极速响应
        const kwItem = allKeywords.find(k => k.id === id);
        if (kwItem) kwItem.is_active = newActive;
        renderMatrixGrid();

        try {
          await window.hrApi.updateRecruitParseKeyword(id, { is_active: newActive });
          showToast(`已${newActive ? '开启' : '暂存关闭'}关键词【${kwItem?.keyword}】`);
        } catch (err) {
          showToast(`操作失败: ${err.message || String(err)}`);
          await loadData(); // 恢复数据
        }
      });

      // 删除自定义新词
      document.getElementById("kwMatrixGrid")?.addEventListener("click", async (e) => {
        const delBtn = e.target.closest('[data-action="delete-kw"]');
        if (!delBtn) return;
        e.preventDefault();
        e.stopPropagation();
        
        const id = Number(delBtn.dataset.id);
        const kwItem = allKeywords.find(k => k.id === id);
        if (!confirm(`确定要从矩阵中删除关键词【${kwItem?.keyword || ''}】吗？`)) return;

        try {
          await window.hrApi.deleteRecruitParseKeyword(id);
          showToast(`已删除关键词【${kwItem?.keyword}】`);
          await loadData();
        } catch (err) {
          showToast(`删除失败: ${err.message || String(err)}`);
        }
      });

      // 快捷一键内联新增新词
      document.getElementById("inlineAddForm")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("newKwInput");
        const val = input?.value?.trim();
        if (!val) return;

        // 检查重复
        if (allKeywords.some(k => k.keyword === val)) {
          showToast(`关键词【${val}】已存在于矩阵中！`);
          input.value = "";
          return;
        }

        try {
          await window.hrApi.createRecruitParseKeyword({ keyword: val, is_active: true });
          showToast(`已成功添加新关注关键词【${val}】并勾选生效！`);
          input.value = "";
          await loadData();
        } catch (err) {
          showToast(`添加失败: ${err.message || String(err)}`);
        }
      });
    });
  </script>
</body>
</html>
