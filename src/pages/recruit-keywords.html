<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>解析关键词配置</title>
  <link rel="stylesheet" href="../../styles.css?v=20260728-jd-profile" />
  <script defer src="../../frontend-api.js?v=20260728-jd-parse-fix"></script>
  <script defer src="../../app.js?v=20260728-jd-profile"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const CATEGORY_LABELS = {
      skills: "岗位技能",
      job_category: "职类名称",
      industry: "行业背景",
      licenses: "特种作业/证书",
      experience: "从业门槛",
    };

    const PAGE_ICONS = {
      tags: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2H2v10l11 11 10-10L12 2z"/><circle cx="7" cy="7" r="2"/></svg>',
      plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>',
      inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
    };

    let allKeywords = [];
    let currentCategoryFilter = "";

    window.__PAGE_BODY__ = `
      <div class="recruit-keywords-page">
        <!-- 统计指标 -->
        <section class="metrics is-three">
          <div class="metric-card tone-primary">
            <div class="metric-top"><div><div class="section-sub">解析词库总数</div></div><div class="metric-icon">${PAGE_ICONS.tags}</div></div>
            <div class="metric-value" data-kw-total>0</div>
          </div>
          <div class="metric-card tone-success">
            <div class="metric-top"><div><div class="section-sub">技能与职类词</div></div><div class="metric-icon">${PAGE_ICONS.tags}</div></div>
            <div class="metric-value" data-kw-skills-cat>0</div>
          </div>
          <div class="metric-card tone-warning">
            <div class="metric-top"><div><div class="section-sub">证书与特种作业</div></div><div class="metric-icon">${PAGE_ICONS.tags}</div></div>
            <div class="metric-value" data-kw-licenses>0</div>
          </div>
        </section>

        <!-- 工具栏与分类过滤 -->
        <section class="panel margin-top-md">
          <div class="section-head">
            <div>
              <h3>JD 解析关键词规则库</h3>
              <div class="section-sub">此处的关键词将作为 JD 智能解析与机器人的特征过滤典范。</div>
            </div>
            <div class="hero-actions">
              <button class="btn primary" type="button" data-action="open-add-kw-modal">
                <span class="btn-icon">${PAGE_ICONS.plus}</span>
                添加解析关键词
              </button>
            </div>
          </div>

          <div class="toolbar-tabs margin-top-sm" data-kw-category-tabs>
            <button class="tab-btn is-active" data-category="">全部分类</button>
            <button class="tab-btn" data-category="skills">岗位技能 (skills)</button>
            <button class="tab-btn" data-category="job_category">职类名称 (job_category)</button>
            <button class="tab-btn" data-category="industry">行业背景 (industry)</button>
            <button class="tab-btn" data-category="licenses">特种作业/证书 (licenses)</button>
          </div>

          <div class="table-card margin-top-md">
            <div class="kw-table-head">
              <div>ID</div>
              <div>分类维度</div>
              <div>关键词名称</div>
              <div>启用状态</div>
              <div>创建时间</div>
              <div>操作</div>
            </div>
            <div class="kw-table-body" data-kw-table-body>
              <div class="table-empty">
                <div class="table-empty-icon">${PAGE_ICONS.inbox}</div>
                <div class="table-empty-title">解析关键词加载中...</div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- 添加/编辑关键词 Modal 弹窗 -->
      <div class="modal" id="kwModal" style="display:none;">
        <div class="modal-backdrop" data-action="close-kw-modal"></div>
        <div class="panel modal-content" style="max-width:460px;">
          <div class="section-head">
            <div>
              <h3 id="kwModalTitle">添加解析关键词</h3>
              <div class="section-sub">保存后 JD 智能解析引擎将自动包含此关键词</div>
            </div>
            <button class="btn-icon" type="button" data-action="close-kw-modal">✕</button>
          </div>
          <form id="kwForm" style="margin-top:16px;">
            <input type="hidden" id="kwId" />
            <div class="job-field-card">
              <label class="job-field-label">分类维度</label>
              <select class="input wide job-select" id="kwCategory">
                <option value="skills">岗位技能 (skills)</option>
                <option value="job_category">职类名称 (job_category)</option>
                <option value="industry">行业背景 (industry)</option>
                <option value="licenses">特种作业/证书 (licenses)</option>
                <option value="experience">从业门槛 (experience)</option>
              </select>
            </div>
            <div class="job-field-card margin-top-sm">
              <label class="job-field-label">关键词文本</label>
              <input class="input wide" id="kwText" placeholder="例如：Java、电工证、办公软件" required />
            </div>
            <div class="job-field-card margin-top-sm">
              <label class="portrait-switch-label">
                <input type="checkbox" id="kwActive" checked />
                <span>立即启用该关键词参与 JD 解析</span>
              </label>
            </div>
            <div class="hero-actions margin-top-md" style="justify-content:flex-end;">
              <button class="btn btn-secondary" type="button" data-action="close-kw-modal">取消</button>
              <button class="btn primary" type="submit">保存关键词</button>
            </div>
          </form>
        </div>
      </div>
    `;

    function renderKeywordsTable() {
      const tbody = document.querySelector("[data-kw-table-body]");
      if (!tbody) return;

      const filtered = currentCategoryFilter
        ? allKeywords.filter(k => k.category === currentCategoryFilter)
        : allKeywords;

      if (!filtered.length) {
        tbody.innerHTML = `
          <div class="table-empty">
            <div class="table-empty-icon">${PAGE_ICONS.inbox}</div>
            <div class="table-empty-title">暂无关键词配置</div>
            <div class="table-empty-desc">点击上方按钮添加第一条 JD 解析关键词。</div>
          </div>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(item => `
        <div class="kw-table-row">
          <div>#${item.id}</div>
          <div><span class="import-status-pill tone-primary">${CATEGORY_LABELS[item.category] || item.category}</span></div>
          <div class="font-bold">${escapeHtml(item.keyword)}</div>
          <div>
            <span class="import-status-pill tone-${item.is_active ? 'success' : 'muted'}">
              ${item.is_active ? '已启用' : '已禁用'}
            </span>
          </div>
          <div class="text-sub">${escapeHtml(item.created_at || '-')}</div>
          <div class="kw-actions">
            <button class="btn btn-secondary btn-sm" data-action="toggle-kw" data-id="${item.id}" data-active="${item.is_active}">
              ${item.is_active ? '禁用' : '启用'}
            </button>
            <button class="btn btn-danger btn-sm" data-action="delete-kw" data-id="${item.id}">删除</button>
          </div>
        </div>
      `).join("");
    }

    function updateMetrics() {
      document.querySelector("[data-kw-total]").textContent = String(allKeywords.length);
      const skillsAndCat = allKeywords.filter(k => k.category === "skills" || k.category === "job_category").length;
      document.querySelector("[data-kw-skills-cat]").textContent = String(skillsAndCat);
      const licenses = allKeywords.filter(k => k.category === "licenses").length;
      document.querySelector("[data-kw-licenses]").textContent = String(licenses);
    }

    async function loadData() {
      const res = await window.hrApi.recruitParseKeywords();
      allKeywords = res.keywords || [];
      updateMetrics();
      renderKeywordsTable();
    }

    window.addEventListener("DOMContentLoaded", async () => {
      await renderApp();
      await loadData().catch(err => showToast(err.message || String(err)));

      // Tab 分类切换
      document.querySelector("[data-kw-category-tabs]")?.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-category]");
        if (!btn) return;
        document.querySelectorAll("[data-kw-category-tabs] button").forEach(b => b.classList.remove("is-active"));
        btn.classList.add("is-active");
        currentCategoryFilter = btn.dataset.category || "";
        renderKeywordsTable();
      });

      // 弹窗控制
      const modal = document.getElementById("kwModal");
      document.addEventListener("click", async (e) => {
        if (e.target.closest('[data-action="open-add-kw-modal"]')) {
          document.getElementById("kwForm").reset();
          document.getElementById("kwId").value = "";
          document.getElementById("kwModalTitle").textContent = "添加解析关键词";
          modal.style.display = "flex";
        }
        if (e.target.closest('[data-action="close-kw-modal"]')) {
          modal.style.display = "none";
        }

        // 开关启用/禁用
        const toggleBtn = e.target.closest('[data-action="toggle-kw"]');
        if (toggleBtn) {
          const id = Number(toggleBtn.dataset.id);
          const currentActive = toggleBtn.dataset.active === "true";
          try {
            await window.hrApi.updateRecruitParseKeyword(id, { is_active: !currentActive });
            showToast(`已${!currentActive ? '启用' : '禁用'}关键词`);
            await loadData();
          } catch (err) {
            showToast(`操作失败: ${err.message || String(err)}`);
          }
        }

        // 删除
        const deleteBtn = e.target.closest('[data-action="delete-kw"]');
        if (deleteBtn) {
          const id = Number(deleteBtn.dataset.id);
          if (!confirm("确定要删除此解析关键词吗？")) return;
          try {
            await window.hrApi.deleteRecruitParseKeyword(id);
            showToast("已删除关键词");
            await loadData();
          } catch (err) {
            showToast(`删除失败: ${err.message || String(err)}`);
          }
        }
      });

      // 提交表单
      document.getElementById("kwForm")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          category: document.getElementById("kwCategory").value,
          keyword: document.getElementById("kwText").value.trim(),
          is_active: document.getElementById("kwActive").checked,
        };
        try {
          await window.hrApi.createRecruitParseKeyword(payload);
          showToast("保存解析关键词成功！");
          modal.style.display = "none";
          await loadData();
        } catch (err) {
          showToast(`保存失败: ${err.message || String(err)}`);
        }
      });
    });
  </script>
</body>
</html>
