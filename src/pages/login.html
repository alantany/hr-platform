<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <link rel="stylesheet" href="../../styles.css" />
  <script defer src="../../frontend-api.js?v=20260630"></script>
  <style>
    :root {
      --login-ink: #0f172a;
      --login-muted: #64748b;
      --login-line: #e2e8f0;
      --login-primary: #3b82f6;
      --login-bg-top: #e0f2fe;
      --login-bg-bottom: #ffffff;
    }

    body {
      margin: 0;
      color: var(--login-ink);
      background: linear-gradient(180deg, var(--login-bg-top) 0%, var(--login-bg-bottom) 72%);
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .login-stage {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      overflow: hidden;
    }

    .login-stage::before,
    .login-stage::after {
      content: "";
      position: absolute;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      pointer-events: none;
    }

    .login-stage::before {
      width: 520px;
      height: 520px;
      top: -180px;
      right: -120px;
    }

    .login-stage::after {
      width: 360px;
      height: 360px;
      top: -40px;
      right: 40px;
      border-color: rgba(191, 219, 254, 0.7);
    }

    .login-shell {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 48px;
      align-items: center;
    }

    .login-brief {
      padding: 12px 8px;
    }

    .login-logo {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 10px 24px rgba(59, 130, 246, 0.28));
    }

    .login-logo img {
      width: 72px;
      height: 72px;
      display: block;
      object-fit: contain;
    }

    .login-brief h1 {
      margin: 28px 0 0;
      font-size: clamp(32px, 4vw, 44px);
      line-height: 1.15;
      letter-spacing: -0.03em;
      font-weight: 800;
    }

    .login-brief p {
      margin: 12px 0 0;
      color: var(--login-ink);
      font-size: 16px;
      font-weight: 500;
    }

    .login-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .login-pill {
      min-width: 7.5em;
      padding: 8px 14px;
      border: 1px solid #BFDBFE;
      border-radius: 999px;
      background: #EFF6FF;
      color: #2563eb;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      box-shadow: 0 1px 2px rgba(59, 130, 246, 0.06);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      cursor: default;
    }

    .login-pill:hover {
      transform: translateY(-2px);
      border-color: #93C5FD;
      background: #DBEAFE;
      box-shadow: 0 8px 18px rgba(59, 130, 246, 0.18);
    }

    .login-form {
      padding: 40px 36px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.1);
    }

    .login-title {
      margin: 0 0 28px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .login-field {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }

    .login-field label {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
    }

    .login-field input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--login-line);
      border-radius: 10px;
      padding: 0 14px;
      background: #fff;
      color: var(--login-ink);
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }

    .login-field input:focus {
      border-color: var(--login-primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    .login-submit {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      border: 0;
      border-radius: 10px;
      background: var(--login-primary);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-submit:hover {
      filter: brightness(1.05);
    }

    .login-message {
      min-height: 22px;
      margin-top: 12px;
      color: #b04435;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .login-stage { padding: 28px 18px; }
      .login-shell { grid-template-columns: 1fr; gap: 28px; }
      .login-form { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <main class="login-stage">
    <section class="login-shell" aria-label="登录到 AI 招聘管理平台">
      <aside class="login-brief">
        <div class="login-logo" aria-label="职易达">
          <img
            src="../../assets/zhiyida-mark.png"
            srcset="../../assets/zhiyida-mark.png 1x, ../../assets/zhiyida-mark@2x.png 2x"
            alt="职易达"
            width="72"
            height="72"
          />
        </div>
        <h1>AI招聘管理平台</h1>
        <p>人力资源管理系统 v3.0</p>
        <div class="login-pills">
          <span class="login-pill">AI简历筛选</span>
          <span class="login-pill">JD自动匹配</span>
          <span class="login-pill">候选状态跟踪</span>
          <span class="login-pill">招聘交付闭环</span>
        </div>
      </aside>
      <form class="login-form" data-login-form>
        <h2 class="login-title">登录系统</h2>
        <div class="login-field">
          <label for="login-username">账号</label>
          <input id="login-username" data-login-username value="admin" autocomplete="username" />
        </div>
        <div class="login-field">
          <label for="login-password">密码</label>
          <input id="login-password" type="password" data-login-password value="admin123" autocomplete="current-password" />
        </div>
        <button class="login-submit" type="submit" data-login-submit>登录</button>
        <div class="login-message" data-login-message></div>
      </form>
    </section>
  </main>
  <script>
    const message = document.querySelector('[data-login-message]');
    const submit = async () => {
      if (window.hrApi) {
        window.hrApi.baseUrl = (location.protocol === "file:" || location.port !== "8000") ? "http://127.0.0.1:8000/api" : "/api";
      }
      const username = document.querySelector('[data-login-username]').value.trim();
      const password = document.querySelector('[data-login-password]').value;
      try {
        const result = await window.hrApi.login(username, password);
        localStorage.setItem('hr_token', result.access_token);
        window.hrApi.token = result.access_token;
        const next = new URLSearchParams(location.search).get('next') || 'dashboard.html';
        location.href = `./${next}`;
      } catch (err) {
        message.textContent = '登录失败：账号、密码或账号状态不正确。';
      }
    };
    document.querySelector('[data-login-form]').addEventListener('submit', (event) => {
      event.preventDefault();
      submit();
    });
    document.querySelector('[data-login-submit]').addEventListener('click', (event) => {
      event.preventDefault();
      submit();
    });
    const reason = new URLSearchParams(location.search).get('reason');
    if (reason === 'kicked') {
      message.textContent = '您的账号已在其他设备登录，请重新登录。';
    }
  </script>
</body>
</html>
