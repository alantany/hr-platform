<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首页 - AI招聘管理平台</title>
  <link rel="stylesheet" href="../../styles.css" />
  <script defer src="../../frontend-api.js"></script>
  <script defer src="../../app.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    window.__PAGE_BODY__ = `
      <section class="dashboard-redesign">
        <section class="dashboard-kanban-grid" data-dashboard-top-cards></section>

        <section class="dashboard-main-row">
          <section class="dashboard-calendar-panel panel">
            <div class="dashboard-section-head">
              <div>
                <h3>推荐日历</h3>
                <p class="panel-sub">按天查看推荐节奏与顾问分组。</p>
              </div>
              <div class="dashboard-calendar-toolbar">
                <button class="dashboard-calendar-nav" type="button" data-calendar-nav="-1" aria-label="上一个月">‹</button>
                <div class="dashboard-calendar-month" data-calendar-month-label>--</div>
                <button class="dashboard-calendar-nav" type="button" data-calendar-nav="1" aria-label="下一个月">›</button>
              </div>
            </div>
            <div class="dashboard-calendar-summary" data-calendar-summary></div>
            <div class="dashboard-calendar-board">
              <div class="dashboard-calendar-weekdays" data-calendar-weekdays></div>
              <div class="dashboard-calendar-grid" data-calendar-grid></div>
            </div>
            <div class="dashboard-calendar-detail" data-calendar-detail></div>
          </section>

          <section class="dashboard-month-panel panel">
            <div class="dashboard-section-head">
              <div>
                <h3>月度数据看板</h3>
                <p class="panel-sub">汇总本月推荐、面试、入职与客户反馈。</p>
              </div>
              <div class="dashboard-month-caption" data-month-caption>--</div>
            </div>
            <div class="dashboard-month-grid" data-dashboard-month-cards></div>
            <div class="dashboard-candidate-panel" data-dashboard-candidate-list></div>
          </section>
        </section>
      </section>
    `;

    const dashboardState = {
      summary: null,
      projects: [],
      positions: [],
      todos: [],
      recommendations: [],
      deliveries: [],
      interviews: [],
      trackingEvents: [],
      employments: [],
      candidates: [],
      recommendationCalendar: [],
      calendarMonth: null,
      selectedDayKey: '',
      // '' | day | interview | recommend | employment | position
      detailListSource: '',
    };

    const WEEKDAY_LABELS = ['日', '一', '二', '三', '四', '五', '六'];

    function parseDateValue(value) {
      if (!value) return null;
      if (value instanceof Date) return Number.isNaN(value.getTime()) ? null : value;
      let normalized = typeof value === 'string' && value.includes(' ') ? value.replace(' ', 'T') : value;
      // 后端多为 UTC 无时区串；按 UTC 解析，避免与日历/月度看板各算各的
      if (typeof normalized === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(normalized) && !/[zZ]|[+-]\d{2}:?\d{2}$/.test(normalized)) {
        normalized = `${normalized}Z`;
      }
      const date = new Date(normalized);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function monthStart(date) {
      return new Date(date.getFullYear(), date.getMonth(), 1);
    }

    function addMonths(date, offset) {
      return new Date(date.getFullYear(), date.getMonth() + offset, 1);
    }

    function dayKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatMonthLabel(date) {
      return `${date.getFullYear()}年${date.getMonth() + 1}月`;
    }

    function formatDayLabel(date) {
      return `${date.getMonth() + 1}月${date.getDate()}日`;
    }

    function sameMonth(left, right) {
      return left.getFullYear() === right.getFullYear() && left.getMonth() === right.getMonth();
    }

    function formatNumber(value) {
      return new Intl.NumberFormat('zh-CN').format(Number(value || 0));
    }

    function getLatestDate(rows, pickers) {
      const dates = rows
        .flatMap((row) => pickers.map((picker) => parseDateValue(row[picker])))
        .filter(Boolean)
        .sort((a, b) => b - a);
      return dates[0] || null;
    }

    function getCalendarEvents() {
      // 与月度「本月推荐」同一口径：recommended_at 有值的推荐记录
      const calendarMeta = dashboardState.recommendationCalendar || [];
      const metaByRecId = new Map(
        calendarMeta
          .filter((item) => item && item.recommendation_id != null)
          .map((item) => [Number(item.recommendation_id), item])
      );
      const positionNameById = new Map(
        (dashboardState.positions || []).map((row) => [Number(row.id), row.name || ''])
      );
      return (dashboardState.recommendations || []).map((row) => {
        const date = parseDateValue(row.recommended_at);
        if (!date) return null;
        const operator = row.recommender || '未署名顾问';
        const meta = metaByRecId.get(Number(row.id));
        return {
          date,
          operator: meta?.operator || operator,
          // 按推荐记录 ID 取组长；操作员→其组长，组长本人→自己
          groupLeader: meta?.group_leader || '未分组',
          source: 'recommendation',
          candidateId: Number(row.candidate_id) || null,
          recommendationId: row.id,
          recommendationStatus: row.status || '',
          positionId: Number(row.position_id) || null,
          positionName: positionNameById.get(Number(row.position_id)) || '',
        };
      }).filter(Boolean);
    }

    function getCandidateById(candidateId) {
      const id = Number(candidateId);
      if (!id) return null;
      return (dashboardState.candidates || []).find((row) => Number(row.id) === id) || null;
    }

    function getProjectById(projectId) {
      const id = Number(projectId);
      if (!id) return null;
      return (dashboardState.projects || []).find((row) => Number(row.id) === id) || null;
    }

    function fallbackCandidateName(candidateId) {
      const id = Number(candidateId);
      if (!id) return '';
      const fromRec = (dashboardState.recommendations || []).find((row) => Number(row.candidate_id) === id);
      if (fromRec?.candidate_name) return fromRec.candidate_name;
      const fromEmp = (dashboardState.employments || []).find((row) => Number(row.candidate_id) === id);
      if (fromEmp?.candidate_name) return fromEmp.candidate_name;
      return '';
    }

    function buildCandidateListRows(entries) {
      // entries: [{ candidateId, meta?, recommendationStatus?, fallbackName? }]；按候选人去重
      const seen = new Set();
      const rows = [];
      (entries || []).forEach((entry) => {
        const candidateId = Number(entry.candidateId) || null;
        if (!candidateId || seen.has(candidateId)) return;
        seen.add(candidateId);
        const candidate = getCandidateById(candidateId);
        rows.push({
          kind: 'candidate',
          candidateId,
          title: candidate?.name || entry.fallbackName || fallbackCandidateName(candidateId) || `候选人 #${candidateId}`,
          subtitle: [candidate?.city, candidate?.phone].filter(Boolean).join(' · ') || '暂无城市/手机',
          meta: entry.meta || '',
          chip: candidate?.delivery_status || entry.recommendationStatus || '候选人',
          tone: 'primary',
        });
      });
      return rows;
    }

    function buildPositionListRows(positions) {
      return (positions || []).map((position) => {
        const project = getProjectById(position.project_id);
        const created = parseDateValue(position.created_at);
        const createdLabel = created ? formatDayLabel(created) : '--';
        return {
          kind: 'position',
          positionId: Number(position.id) || null,
          title: position.name || `岗位 #${position.id}`,
          subtitle: [project?.name || '未关联项目', position.location || '地点未填'].filter(Boolean).join(' · '),
          meta: [project?.company_name || '未知公司', `创建 ${createdLabel}`, `招聘 ${position.hiring_count || 0} 人`].join(' · '),
          chip: position.urgency || '中',
          tone: position.urgency === '高' ? 'danger' : (position.urgency === '低' ? 'neutral' : 'warning'),
        };
      });
    }

    function clearDetailList() {
      dashboardState.detailListSource = '';
      renderMonthCards();
      renderDetailPanel();
    }

    function setDetailListSource(source) {
      dashboardState.detailListSource = source || '';
      renderMonthCards();
      renderCalendar();
      renderDetailPanel();
    }

    function collectDetailPanelModel() {
      const monthDate = dashboardState.calendarMonth || monthStart(new Date());
      const metrics = getMonthlyMetrics(monthDate);
      const source = dashboardState.detailListSource;
      if (!source) {
        return { active: false, rows: [] };
      }
      if (source === 'day') {
        const dayEvents = getCalendarEvents().filter((row) => dayKey(row.date) === dashboardState.selectedDayKey);
        const rows = buildCandidateListRows(dayEvents.map((row) => ({
          candidateId: row.candidateId,
          recommendationStatus: row.recommendationStatus,
          meta: [row.positionName ? `推荐岗位：${row.positionName}` : '', `${formatDayLabel(row.date)}推荐`].filter(Boolean).join(' · '),
        })));
        return { active: true, rows };
      }
      if (source === 'interview') {
        const rows = buildCandidateListRows([...metrics.interviewCandidateIds].map((id) => ({
          candidateId: id,
          meta: '本月面试活动（跟踪/面试记录/面试中推荐/本月入职）',
        })));
        return { active: true, rows };
      }
      if (source === 'recommend') {
        const rows = buildCandidateListRows(metrics.monthlyCalendarEvents.map((row) => ({
          candidateId: row.candidateId,
          recommendationStatus: row.recommendationStatus,
          meta: [row.positionName ? `推荐岗位：${row.positionName}` : '', row.date ? `${formatDayLabel(row.date)}推荐` : ''].filter(Boolean).join(' · '),
        })));
        return { active: true, rows };
      }
      if (source === 'employment') {
        const rows = buildCandidateListRows([...metrics.hiredCandidateIds].map((id) => ({
          candidateId: id,
          recommendationStatus: '已入职',
          meta: '本月入职（按入职日）',
        })));
        return { active: true, rows };
      }
      if (source === 'position') {
        return { active: true, rows: buildPositionListRows(metrics.monthlyPositions) };
      }
      return { active: false, rows: [] };
    }

    function renderDetailPanel() {
      const container = document.querySelector('[data-dashboard-candidate-list]');
      if (!container) return;
      const model = collectDetailPanelModel();
      if (!model.active) {
        container.innerHTML = `
          <div class="dashboard-detail-empty">
            点击上方指标或左侧日历日期，在此查看明细
          </div>
        `;
        return;
      }
      if (!model.rows.length) {
        container.innerHTML = `<div class="dashboard-detail-empty">当前条件下暂无数据</div>`;
        return;
      }
      container.innerHTML = `
        <div class="dashboard-detail-list">
          ${model.rows.map((row) => `
            <div class="dashboard-detail-row">
              <div class="dashboard-detail-row-main">
                <div class="dashboard-detail-row-title">${escapeHtml(row.title)}</div>
                <div class="dashboard-detail-row-subtitle">${escapeHtml(row.subtitle)}</div>
                <div class="dashboard-detail-row-meta">${escapeHtml(row.meta || '—')}</div>
              </div>
              <span class="dashboard-detail-chip tone-${row.tone || 'neutral'}">${escapeHtml(row.chip || '')}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function getMonthRows(rows, picker, monthDate, predicate = null) {
      return rows.filter((row) => {
        const date = parseDateValue(row[picker]);
        if (!date || !sameMonth(date, monthDate)) return false;
        return predicate ? predicate(row) : true;
      });
    }

    function getEmploymentMonthDate(row) {
      return parseDateValue(row.onboard_date) || parseDateValue(row.created_at);
    }

    function getInterviewActivityDate(row) {
      return parseDateValue(row.interview_date) || parseDateValue(row.interview_time) || parseDateValue(row.created_at);
    }

    function isInterviewTrackingEvent(row) {
      return Boolean(String(row.interview_round || '').trim() || String(row.interview_date || '').trim());
    }

    function getMonthlyMetrics(monthDate) {
      // 入职：本月已入职（按入职日），按候选人去重
      const monthlyEmployments = (dashboardState.employments || []).filter((row) => {
        if (row.status !== '已入职') return false;
        const date = getEmploymentMonthDate(row);
        return date && sameMonth(date, monthDate);
      });
      const hiredCandidateIds = new Set(monthlyEmployments.map((row) => Number(row.candidate_id)).filter(Boolean));

      // 面试活动：跟踪表（初筛/各轮）+ 面试记录 + 当前仍处面试状态的推荐
      const trackingInterviewIds = new Set(
        (dashboardState.trackingEvents || [])
          .filter((row) => isInterviewTrackingEvent(row))
          .filter((row) => {
            const date = getInterviewActivityDate(row);
            return date && sameMonth(date, monthDate);
          })
          .map((row) => Number(row.candidate_id))
          .filter(Boolean)
      );
      const interviewRecordIds = new Set(
        (dashboardState.interviews || [])
          .filter((row) => {
            const date = getInterviewActivityDate(row);
            return date && sameMonth(date, monthDate);
          })
          .map((row) => Number(row.candidate_id))
          .filter(Boolean)
      );
      const interviewingRecIds = new Set(
        getMonthRows(
          dashboardState.recommendations,
          'updated_at',
          monthDate,
          (row) => ['安排面试', '面试中'].includes(row.status)
        ).map((row) => Number(row.candidate_id)).filter(Boolean)
      );

      // 漏斗：本月入职的人一定算本月面试过
      const interviewCandidateIds = new Set([
        ...trackingInterviewIds,
        ...interviewRecordIds,
        ...interviewingRecIds,
        ...hiredCandidateIds,
      ]);

      // 本月推荐数：与日历同一批事件（recommended_at 落在本月）
      const monthlyCalendarEvents = getCalendarEvents().filter((row) => sameMonth(row.date, monthDate));
      const monthlyRecommendedCount = monthlyCalendarEvents.length;

      const monthlyDeliveries = getMonthRows(dashboardState.deliveries, 'delivered_at', monthDate);
      const monthlyPositions = getMonthRows(dashboardState.positions, 'created_at', monthDate);
      const activeProjects = dashboardState.projects.filter((row) => row.status !== '招聘完毕').length;
      const activeOperators = new Set(monthlyCalendarEvents.map((row) => row.operator || '未署名顾问')).size;
      return {
        monthlyInterviewCount: interviewCandidateIds.size,
        monthlyRecommendedCount,
        monthlyEmploymentCount: hiredCandidateIds.size,
        interviewCandidateIds,
        hiredCandidateIds,
        monthlyDeliveries,
        monthlyPositions,
        monthlyCalendarEvents,
        activeProjects,
        activeOperators,
      };
    }

    function colorizeNote(note, tone) {
      return String(note || '').replace(/(\d[\d,]*)/g, `<em class="dashboard-kanban-note-num tone-${tone}">$1</em>`);
    }

    function renderTopCards() {
      const container = document.querySelector('[data-dashboard-top-cards]');
      if (!container || !dashboardState.summary) return;
      const metrics = getMonthlyMetrics(dashboardState.calendarMonth);
      const cards = [
        {
          title: '求职者总数',
          value: dashboardState.summary.candidate_count,
          note: `本月推荐 ${metrics.monthlyRecommendedCount} 人`,
          tone: 'primary',
          link: './candidates.html',
        },
        {
          title: '客户公司数',
          value: dashboardState.summary.company_count,
          note: `当前有 ${metrics.activeProjects} 个项目在推进`,
          tone: 'success',
          link: './customers.html',
        },
        {
          title: '总推荐数',
          value: dashboardState.summary.recommendation_count,
          note: `本月入职 ${metrics.monthlyEmploymentCount} 人`,
          tone: 'warning',
          link: './candidates.html?exclude=recommended',
        },
        {
          title: '待办岗位',
          value: dashboardState.todos.length,
          note: dashboardState.todos.length ? `有 ${dashboardState.todos.length} 个岗位等待确认` : '当前没有待确认岗位',
          tone: 'danger',
          link: './notifications.html?tab=position-tasks',
        },
        {
          title: '总操作员数',
          value: dashboardState.summary.user_count,
          note: `本月活跃顾问 ${metrics.activeOperators} 人`,
          tone: 'neutral',
          link: './users.html',
        },
      ];
      container.innerHTML = cards.map((card) => `
        <a href="${card.link}" class="dashboard-kanban-card tone-${card.tone}" style="display: block; text-decoration: none;">
          <div class="dashboard-kanban-title">${card.title}</div>
          <div class="dashboard-kanban-body">
            <strong class="dashboard-kanban-value tone-${card.tone}">${formatNumber(card.value)}</strong>
            <span class="dashboard-kanban-note">${colorizeNote(card.note, card.tone)}</span>
          </div>
        </a>
      `).join('');
    }

    function renderCalendarWeekdays() {
      const container = document.querySelector('[data-calendar-weekdays]');
      if (!container) return;
      container.innerHTML = WEEKDAY_LABELS.map((label) => `<div>${label}</div>`).join('');
    }

    function buildCalendarCells(monthDate, eventRows) {
      const firstDay = monthStart(monthDate);
      const start = new Date(firstDay);
      start.setDate(firstDay.getDate() - firstDay.getDay());
      const counts = eventRows.reduce((acc, row) => {
        const key = dayKey(row.date);
        acc[key] = acc[key] || { count: 0, operators: new Set() };
        acc[key].count += 1;
        acc[key].operators.add(row.operator);
        return acc;
      }, {});
      const todayKey = dayKey(new Date());
      const cells = [];
      for (let index = 0; index < 42; index += 1) {
        const cellDate = new Date(start);
        cellDate.setDate(start.getDate() + index);
        const key = dayKey(cellDate);
        const stat = counts[key] || { count: 0, operators: new Set() };
        cells.push({
          key,
          date: cellDate,
          inMonth: sameMonth(cellDate, monthDate),
          isToday: key === todayKey,
          isSelected: key === dashboardState.selectedDayKey,
          count: stat.count,
          operatorCount: stat.operators.size,
        });
      }
      return cells;
    }

    function renderCalendar() {
      const monthDate = dashboardState.calendarMonth || monthStart(new Date());
      const events = getCalendarEvents().filter((row) => sameMonth(row.date, monthDate));
      const cells = buildCalendarCells(monthDate, events);
      const monthLabel = document.querySelector('[data-calendar-month-label]');
      if (monthLabel) monthLabel.textContent = formatMonthLabel(monthDate);

      const grid = document.querySelector('[data-calendar-grid]');
      if (grid) {
        grid.innerHTML = cells.map((cell) => `
          <button
            type="button"
            class="dashboard-calendar-cell${cell.inMonth ? '' : ' is-outside'}${cell.isToday ? ' is-today' : ''}${cell.isSelected ? ' is-selected' : ''}"
            data-day-key="${cell.key}"
          >
            <span class="dashboard-calendar-date">${cell.date.getDate()}</span>
            <span class="dashboard-calendar-count${cell.count ? ' has-data' : ''}">${cell.count ? `${cell.count}条` : '0条'}</span>
          </button>
        `).join('');
      }

      const total = events.length;
      const peak = cells
        .filter((cell) => cell.inMonth)
        .sort((left, right) => right.count - left.count)[0];
      const summary = document.querySelector('[data-calendar-summary]');
      if (summary) {
        summary.innerHTML = `
          <div class="dashboard-summary-chip tone-primary">
            <strong>${formatNumber(total)}</strong>
            <span>本月累计推荐</span>
          </div>
          <div class="dashboard-summary-chip tone-warning">
            <strong>${peak && peak.count ? formatDayLabel(peak.date) : '--'}</strong>
            <span>${peak && peak.count ? `单日峰值 ${peak.count} 条` : '暂无推荐峰值'}</span>
          </div>
        `;
      }

      const selectedDate = parseDateValue(dashboardState.selectedDayKey) || monthDate;
      const detailRows = events.filter((item) => dayKey(item.date) === dashboardState.selectedDayKey);
      const detail = document.querySelector('[data-calendar-detail]');
      if (detail) {
        const groupCounts = [...detailRows.reduce((groups, row) => {
          const groupName = row.groupLeader || '未分组';
          groups.set(groupName, (groups.get(groupName) || 0) + 1);
          return groups;
        }, new Map()).entries()].map(([name, count]) => ({ name, count }));
        detail.innerHTML = `
          <div class="dashboard-calendar-detail-copy">
            <div class="dashboard-calendar-detail-title">${dashboardState.selectedDayKey ? formatDayLabel(selectedDate) : `${formatMonthLabel(monthDate)}总览`}</div>
            <div class="dashboard-calendar-detail-meta">
              ${detailRows.length ? `当天共推荐 ${detailRows.length} 人，涉及 ${groupCounts.length} 个组` : '当天暂无推荐记录'}
            </div>
          </div>
          <div class="dashboard-calendar-detail-tags">
            ${groupCounts.map((group) => {
              const label = group.name === '未分组'
                ? `未分组推荐 ${group.count} 人`
                : `${escapeHtml(group.name)}组 推荐 ${group.count} 人`;
              return `<span class="dashboard-operator-chip">${label}</span>`;
            }).join('') || '<span class="dashboard-operator-chip is-muted">暂无分组推荐记录</span>'}
          </div>
        `;
      }
    }

    function renderMonthCards() {
      const monthDate = dashboardState.calendarMonth || monthStart(new Date());
      const metrics = getMonthlyMetrics(monthDate);
      const container = document.querySelector('[data-dashboard-month-cards]');
      if (!container) return;
      const cards = [
        {
          key: 'interview',
          title: '本月面试数量',
          value: metrics.monthlyInterviewCount,
          note: metrics.monthlyInterviewCount
            ? `含跟踪面试与本月入职，共 ${metrics.monthlyInterviewCount} 人`
            : '本月暂无面试安排',
          tone: 'primary',
        },
        {
          key: 'recommend',
          title: '本月推荐数量',
          value: metrics.monthlyRecommendedCount,
          note: metrics.monthlyRecommendedCount
            ? `本月变为已推荐 ${metrics.monthlyRecommendedCount} 条`
            : '本月暂无推荐记录',
          tone: 'success',
        },
        {
          key: 'employment',
          title: '本月入职数量',
          value: metrics.monthlyEmploymentCount,
          note: metrics.monthlyEmploymentCount ? '按入职日期统计已入职' : '本月暂无入职转化',
          tone: 'warning',
        },
        {
          key: 'position',
          title: '本月新增岗位',
          value: metrics.monthlyPositions.length,
          note: metrics.monthlyPositions.length ? `本月累计创建 ${metrics.monthlyPositions.length} 个岗位` : '本月暂无新增岗位',
          tone: 'danger',
        },
      ];
      container.innerHTML = cards.map((card) => {
        const active = dashboardState.detailListSource === card.key ? ' is-filter-active' : '';
        return `
        <button
          type="button"
          class="dashboard-month-card tone-${card.tone}${active}"
          data-month-metric="${card.key}"
        >
          <div class="dashboard-month-card-label">${card.title}</div>
          <div class="dashboard-month-card-value">${formatNumber(card.value)}</div>
          <div class="dashboard-month-card-note">${card.note}</div>
        </button>
      `;
      }).join('');

      const caption = document.querySelector('[data-month-caption]');
      if (caption) caption.textContent = formatMonthLabel(monthDate);
    }

    function ensureSelectedDay() {
      const monthDate = dashboardState.calendarMonth;
      const events = getCalendarEvents().filter((row) => sameMonth(row.date, monthDate));
      const availableKeys = [...new Set(events.map((row) => dayKey(row.date)))].sort();
      if (availableKeys.includes(dashboardState.selectedDayKey)) return;
      const today = new Date();
      const todayKey = dayKey(today);
      dashboardState.selectedDayKey =
        (sameMonth(today, monthDate) && availableKeys.includes(todayKey) && todayKey) ||
        availableKeys[availableKeys.length - 1] ||
        dayKey(monthDate);
    }

    function bindCalendarEvents() {
      document.addEventListener('click', (event) => {
        const metricButton = event.target.closest('[data-month-metric]');
        if (metricButton) {
          const key = metricButton.dataset.monthMetric || '';
          if (dashboardState.detailListSource === key) {
            clearDetailList();
          } else {
            setDetailListSource(key);
          }
          return;
        }

        const navButton = event.target.closest('[data-calendar-nav]');
        if (navButton) {
          dashboardState.calendarMonth = addMonths(dashboardState.calendarMonth, Number(navButton.dataset.calendarNav || 0));
          dashboardState.detailListSource = '';
          ensureSelectedDay();
          renderTopCards();
          renderCalendar();
          renderMonthCards();
          renderDetailPanel();
          return;
        }
        const dayButton = event.target.closest('[data-day-key]');
        if (!dayButton) return;
        dashboardState.selectedDayKey = dayButton.dataset.dayKey || dashboardState.selectedDayKey;
        setDetailListSource('day');
      });
    }

    async function loadDashboardData() {
      const requests = await Promise.allSettled([
        window.hrApi.dashboardSummary(),
        window.hrApi.projects(),
        window.hrApi.positions(),
        window.hrApi.dashboardTodos(),
        window.hrApi.recommendations(),
        window.hrApi.deliveries(),
        window.hrApi.interviewRecords(),
        window.hrApi.candidateTrackingEvents(),
        window.hrApi.employmentRecords(),
        window.hrApi.dashboardRecommendationCalendar(),
        window.hrApi.candidates(),
      ]);
      const [
        summaryResult,
        projectsResult,
        positionsResult,
        todosResult,
        recommendationsResult,
        deliveriesResult,
        interviewsResult,
        trackingResult,
        employmentsResult,
        recommendationCalendarResult,
        candidatesResult,
      ] = requests;

      dashboardState.summary = summaryResult.status === 'fulfilled' ? summaryResult.value : {
        candidate_count: 0,
        company_count: 0,
        recommendation_count: 0,
        user_count: 0,
      };
      dashboardState.projects = projectsResult.status === 'fulfilled' ? projectsResult.value : [];
      dashboardState.positions = positionsResult.status === 'fulfilled' ? positionsResult.value : [];
      dashboardState.todos = todosResult.status === 'fulfilled' ? todosResult.value : [];
      dashboardState.recommendations = recommendationsResult.status === 'fulfilled' ? recommendationsResult.value : [];
      dashboardState.deliveries = deliveriesResult.status === 'fulfilled' ? deliveriesResult.value : [];
      dashboardState.interviews = interviewsResult.status === 'fulfilled' ? interviewsResult.value : [];
      dashboardState.trackingEvents = trackingResult.status === 'fulfilled' ? trackingResult.value : [];
      dashboardState.employments = employmentsResult.status === 'fulfilled' ? employmentsResult.value : [];
      dashboardState.recommendationCalendar = recommendationCalendarResult.status === 'fulfilled' ? recommendationCalendarResult.value : [];
      dashboardState.candidates = candidatesResult.status === 'fulfilled' ? candidatesResult.value : [];

      const latestActivity =
        getLatestDate(getCalendarEvents(), ['date']) ||
        getLatestDate(dashboardState.trackingEvents, ['interview_date', 'created_at']) ||
        getLatestDate(dashboardState.interviews, ['interview_time', 'created_at']) ||
        getLatestDate(dashboardState.employments, ['onboard_date', 'created_at']) ||
        new Date();

      dashboardState.calendarMonth = monthStart(latestActivity);
      ensureSelectedDay();
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await renderApp();
      renderCalendarWeekdays();
      bindCalendarEvents();
      try {
        await loadDashboardData();
        renderTopCards();
        renderCalendar();
        renderMonthCards();
        renderDetailPanel();
      } catch (error) {
        console.warn('dashboard load failed', error);
        renderDetailPanel();
      }
    });
  </script>
</body>
</html>
