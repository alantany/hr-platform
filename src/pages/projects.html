window.addEventListener('DOMContentLoaded', async () => {
  await renderApp();
  
  // 初始化过滤器对象
  window.projectFilters = { name: '', companyId: '', status: '', level: '', onlyMine: false };
  window.positionFilters = { name: '', companyId: '', projectId: '', urgency: '', salaryRange: '' };

  try {
    const me = await window.hrApi.me().catch(() => null);
    const isOperator = me?.role === '操作员' || me?.role === 'OPERATOR';
    if (isOperator) {
      const jdBtn = document.querySelector('[data-action="noop"][data-title="JD单生成岗位"]');
      const addPosBtn = document.querySelector('[data-action="open-position-modal"]');
      if (jdBtn) jdBtn.style.display = 'none';
      if (addPosBtn) addPosBtn.style.display = 'none';
    }

    const [projects, companies, positions, assignedProjects] = await Promise.all([
      window.hrApi.projects(),
      window.hrApi.companies(),
      window.hrApi.positions(),
      window.hrApi.myAssignedProjectIds().catch(() => ({ project_ids: [] })),
    ]);
    window.myAssignedProjectIds = assignedProjects?.project_ids || [];
    
    const total = document.querySelector('[data-project-total]');
    const active = document.querySelector('[data-project-active]');
    const finished = document.querySelector('[data-project-finished]');
    const urgent = document.querySelector('[data-project-urgent]');
    if (total) total.textContent = String(projects.length);
    if (active) active.textContent = String(projects.filter(p => p.status === '招聘中').length);
    if (finished) finished.textContent = String(projects.filter(p => p.status === '招聘完毕').length);
    if (urgent) urgent.textContent = String(positions.filter(position => position.urgency === '高').length);
    
    const companyOptions = companies.map((c) => `<option value="${c.id}">${c.name}</option>`).join('');
    
    // 填充搜索表单下拉框
    const searchProjComp = document.querySelector('#search-project-company');
    const searchPosComp = document.querySelector('#search-position-company');
    if (searchProjComp) searchProjComp.innerHTML = `<option value="">全部公司</option>${companyOptions}`;
    if (searchPosComp) searchPosComp.innerHTML = `<option value="">全部公司</option>${companyOptions}`;

    const searchPosProject = document.querySelector('#search-position-project');
    const updateSearchPosProjectOptions = (companyId) => {
      if (!searchPosProject) return;
      const filtered = companyId ? projects.filter(p => p.company_id === Number(companyId)) : projects;
      searchPosProject.innerHTML = `<option value="">全部项目</option>` + filtered.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    };
    updateSearchPosProjectOptions('');
    if (searchPosComp) {
      searchPosComp.addEventListener('change', (e) => updateSearchPosProjectOptions(e.target.value));
    }

    // 填充新建/编辑窗口下拉框
    const createCompany = document.querySelector('[data-project-company]');
    const editCompany = document.querySelector('[data-project-edit-company]');
    if (createCompany) createCompany.innerHTML = `<option value="">请选择客户</option>${companyOptions}`;
    if (editCompany) editCompany.innerHTML = `<option value="">请选择客户</option>${companyOptions}`;
    
    const createPosCompany = document.querySelector('[data-position-company]');
    const createPosProject = document.querySelector('[data-position-project]');
    if (createPosCompany) {
      createPosCompany.innerHTML = `<option value="">请选择客户</option>${companyOptions}`;
    }
    const fillCreatePosProjects = (companyId) => {
      if (!createPosProject) return;
      const filtered = companyId
        ? projects.filter((p) => p.company_id === Number(companyId))
        : [];
      createPosProject.disabled = !companyId;
      createPosProject.innerHTML = companyId
        ? (`<option value="">请选择项目</option>` + filtered.map((p) => `<option value="${p.id}">${String(p.name || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}</option>`).join(''))
        : '<option value="">请先选择客户</option>';
    };
    fillCreatePosProjects('');
    if (createPosCompany) {
      createPosCompany.addEventListener('change', (e) => fillCreatePosProjects(e.target.value));
    }

    // URL ?company_id=&tab= 进入时按客户过滤，并可切到岗位列表
    const urlParams = new URLSearchParams(window.location.search);
    const urlCompanyId = urlParams.get('company_id') || '';
    const urlTab = (urlParams.get('tab') || 'project').toLowerCase();
    if (urlCompanyId) {
      window.projectFilters = window.projectFilters || { name: '', companyId: '', status: '', level: '', onlyMine: false };
      window.projectFilters.companyId = urlCompanyId;
      window.positionFilters = window.positionFilters || { name: '', companyId: '', projectId: '', urgency: '', salaryRange: '' };
      window.positionFilters.companyId = urlCompanyId;
      if (searchProjComp) searchProjComp.value = urlCompanyId;
      if (searchPosComp) {
        searchPosComp.value = urlCompanyId;
        updateSearchPosProjectOptions(urlCompanyId);
      }
    }

    // Tab 切换逻辑
    const tabs = document.querySelectorAll('.sub-tab');
    const projectSearchForm = document.querySelector('#project-search-form');
    const positionSearchForm = document.querySelector('#position-search-form');
    const projectPanel = document.querySelector('#project-panel');
    const positionPanel = document.querySelector('#position-panel');

    const activateSubTab = (mode) => {
      const targetMode = mode === 'position-tab' || mode === 'position' ? 'position-tab' : 'project-tab';
      tabs.forEach((t) => {
        const active = t.dataset.subtab === targetMode;
        t.classList.toggle('active', active);
        t.style.color = active ? '#2563EB' : '#64748b';
        t.style.borderBottomColor = active ? '#2563EB' : 'transparent';
      });
      if (targetMode === 'project-tab') {
        if (projectSearchForm) projectSearchForm.style.display = 'flex';
        if (projectPanel) projectPanel.style.display = 'block';
        if (positionSearchForm) positionSearchForm.style.display = 'none';
        if (positionPanel) positionPanel.style.display = 'none';
      } else {
        if (projectSearchForm) projectSearchForm.style.display = 'none';
        if (projectPanel) projectPanel.style.display = 'none';
        if (positionSearchForm) positionSearchForm.style.display = 'flex';
        if (positionPanel) positionPanel.style.display = 'block';
      }
    };

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        activateSubTab(tab.dataset.subtab);
      });
    });

    if (urlTab === 'position' || urlTab === 'position-tab') {
      activateSubTab('position-tab');
    }

    // 搜索与重置逻辑：项目列表
    document.querySelector('#btn-project-search')?.addEventListener('click', () => {
      window.projectFilters = {
        name: document.querySelector('#search-project-name').value.trim(),
        companyId: document.querySelector('#search-project-company').value,
        status: document.querySelector('#search-project-status').value,
        level: document.querySelector('#search-project-level').value,
        onlyMine: document.querySelector('#filter-my-projects')?.checked || false,
      };
      window.refreshManagementPage();
    });
    document.querySelector('#filter-my-projects')?.addEventListener('change', (e) => {
      window.projectFilters = window.projectFilters || {};
      window.projectFilters.onlyMine = e.target.checked;
      window.refreshManagementPage();
    });
    document.querySelector('#btn-project-reset')?.addEventListener('click', () => {
      document.querySelector('#search-project-name').value = '';
      document.querySelector('#search-project-company').value = '';
      document.querySelector('#search-project-status').value = '';
      document.querySelector('#search-project-level').value = '';
      const mineCheckbox = document.querySelector('#filter-my-projects');
      if (mineCheckbox) mineCheckbox.checked = false;
      window.projectFilters = { name: '', companyId: '', status: '', level: '', onlyMine: false };
      window.refreshManagementPage();
    });

    // 搜索与重置逻辑：岗位列表
    document.querySelector('#btn-position-search')?.addEventListener('click', () => {
      window.positionFilters = {
        name: document.querySelector('#search-position-name').value.trim(),
        companyId: document.querySelector('#search-position-company').value,
        projectId: document.querySelector('#search-position-project').value,
        urgency: document.querySelector('#search-position-urgency').value,
        salaryRange: document.querySelector('#search-position-salary').value
      };
      window.refreshManagementPage();
    });
    document.querySelector('#btn-position-reset')?.addEventListener('click', () => {
      document.querySelector('#search-position-name').value = '';
      document.querySelector('#search-position-company').value = '';
      document.querySelector('#search-position-project').value = '';
      document.querySelector('#search-position-urgency').value = '';
      document.querySelector('#search-position-salary').value = '';
      window.positionFilters = { name: '', companyId: '', projectId: '', urgency: '', salaryRange: '' };
      window.refreshManagementPage();
    });

    // 执行初次渲染
    await window.refreshManagementPage();

  } catch (err) {
    console.warn(err);
  }
});

window.filterProjectsByStatus = function(status) {
  const statusSelect = document.querySelector('#search-project-status');
  if (statusSelect) {
    statusSelect.value = status || '';
  }
  window.projectFilters = window.projectFilters || {};
  window.projectFilters.status = status || '';
  if (window.refreshManagementPage) {
    window.refreshManagementPage();
  }
};
</script>
