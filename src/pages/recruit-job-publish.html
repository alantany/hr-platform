<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岗位发布</title>
  <link rel="stylesheet" href="../../styles.css?v=20260728-jd-profile" />
  <script defer src="../../frontend-api.js"></script>
  <script defer src="../../app.js?v=20260728-jd-profile"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const EDUCATION_OPTIONS = [
      ["", "不限"],
      ["high_school", "高中"],
      ["college", "大专"],
      ["bachelor", "本科"],
      ["master", "硕士"],
      ["unlimited", "不限"],
    ];
    const ACTIVITY_OPTIONS = [
      ["1w", "1 周"],
      ["1m", "1 个月"],
      ["2m", "2 个月"],
      ["3m", "3 个月"],
      ["6m", "半年"],
    ];
    const GREET_OPTIONS = [10, 20, 30, 40, 50];
    const PUBLISH_PAGE_ICONS = {
      list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>',
      calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>',
      inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
      sparkles: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>',
    };

    let currentParsedProfile = null;

    window.__PAGE_BODY__ = `
      <div class="job-publish-page">
      <section class="metrics is-three">
        <a href="./recruit-job-list.html" class="metric-card tone-primary">
          <div class="metric-top"><div><div class="section-sub">岗位总数</div></div><div class="metric-icon">${PUBLISH_PAGE_ICONS.list}</div></div>
          <div class="metric-value" data-recruit-job-total>0</div>
        </a>
        <a href="./recruit-job-list.html?valid=Y" class="metric-card tone-success">
          <div class="metric-top"><div><div class="section-sub">有效岗位</div></div><div class="metric-icon">${PUBLISH_PAGE_ICONS.check}</div></div>
          <div class="metric-value" data-recruit-job-valid>0</div>
        </a>
        <a href="./recruit-daily-tasks.html" class="metric-card tone-warning">
          <div class="metric-top"><div><div class="section-sub">今日任务</div></div><div class="metric-icon">${PUBLISH_PAGE_ICONS.calendar}</div></div>
          <div class="metric-value" data-recruit-task-today>0</div>
        </a>
      </section>

      <section class="job-publish-layout">
        <!-- 左侧面板：岗位发布与 JD 输入 -->
        <div class="job-publish-left">
          <div class="panel job-publish-card">
            <div class="section-head">
              <div>
                <h3>岗位发布与 JD 文本</h3>
                <div class="section-sub">在此输入岗位基本信息与 JD 描述，生成岗位画像。</div>
              </div>
              <div class="hero-actions job-publish-actions">
                <button class="btn primary" type="button" data-action="submit-recruit-job">发布岗位</button>
              </div>
            </div>
            
            <div class="job-field-stack">
              <div class="job-field-card">
                <label class="job-field-label">岗位名称</label>
                <div class="job-field-hint">用于智联岗位下拉选择</div>
                <input class="input wide" data-recruit-field="job_title" placeholder="例如：风电运维工程师" />
              </div>

              <div class="job-field-card">
                <div class="job-field-header-row">
                  <div>
                    <label class="job-field-label">职位描述 (JD 文本)</label>
                    <div class="job-field-hint">输入或粘贴完整 JD，系统将自动过滤提取关键词与百分比画像</div>
                  </div>
                  <button class="btn btn-secondary" type="button" data-action="parse-jd">
                    <span class="btn-icon">${PUBLISH_PAGE_ICONS.sparkles}</span>
                    智能解析 JD
                  </button>
                </div>
                <textarea class="input wide job-jd-textarea" rows="7" data-recruit-field="raw_jd_text" placeholder="粘贴工作职责、岗位要求、薪资福利等 JD 文本..."></textarea>
              </div>

              <div class="job-field-grid-2">
                <div class="job-field-card">
                  <label class="job-field-label">工作地点</label>
                  <input class="input wide" data-recruit-field="work_location" value="长春" />
                </div>
                <div class="job-field-card">
                  <label class="job-field-label">学历要求</label>
                  <select class="input wide job-select" data-recruit-field="education">${EDUCATION_OPTIONS.map(([value, label]) => `<option value="${value}">${label}</option>`).join("")}</select>
                </div>
              </div>

              <div class="job-field-grid-2">
                <div class="job-field-card">
                  <label class="job-field-label">年龄范围</label>
                  <div class="job-field-inline">
                    <input class="input" type="number" min="16" max="99" data-recruit-field="age_min" placeholder="最小" />
                    <input class="input" type="number" min="16" max="99" data-recruit-field="age_max" placeholder="最大" />
                  </div>
                </div>
                <div class="job-field-card">
                  <label class="job-field-label">候选人活跃时间</label>
                  <select class="input wide job-select" data-recruit-field="candidate_activity">${ACTIVITY_OPTIONS.map(([value, label]) => `<option value="${value}" ${value === "1m" ? "selected" : ""}>${label}</option>`).join("")}</select>
                </div>
              </div>

              <div class="job-field-grid-2">
                <div class="job-field-card">
                  <label class="job-field-label">每日打招呼上限</label>
                  <select class="input wide job-select" data-recruit-field="daily_greet_limit">${GREET_OPTIONS.map((value) => `<option value="${value}" ${value === 20 ? "selected" : ""}>${value} 次/天</option>`).join("")}</select>
                </div>
                <div class="job-field-card">
                  <label class="job-field-label">岗位状态</label>
                  <select class="input wide job-select" data-recruit-field="is_valid"><option value="Y">Y 有效</option><option value="N">N 跳过</option></select>
                </div>
              </div>

              <div class="job-field-card">
                <label class="job-field-label">搜索关键词</label>
                <div class="job-field-hint">机器人抓取时的辅助搜索关键词</div>
                <input class="input wide" maxlength="80" data-recruit-field="search_keyword" placeholder="自动从 JD 提取或手动补充" />
              </div>
            </div>
          </div>
        </div>

        <!-- 右侧面板：岗位画像可视化面板 (参考截图设计) -->
        <div class="job-publish-right">
          <div class="panel job-portrait-panel">
            <div class="portrait-header">
              <div class="portrait-header-main">
                <div class="portrait-avatar">🤖</div>
                <div>
                  <div class="portrait-title">
                    岗位画像
                    <span class="portrait-edit-icon" title="编辑画像">✏️</span>
                  </div>
                  <div class="portrait-time" data-portrait-parsed-at>JD解析时间：暂未解析</div>
                </div>
              </div>
            </div>

            <!-- 岗位硬性要求 -->
            <div class="portrait-section">
              <div class="portrait-section-title text-primary">
                <span class="portrait-icon">🔒</span> 岗位硬性要求
              </div>
              <div class="portrait-item-row">
                <span class="portrait-label">● 年龄</span>
                <span class="portrait-val" data-portrait-age>16-40岁</span>
              </div>
              <div class="portrait-item-row">
                <span class="portrait-label">● 学历</span>
                <span class="portrait-val" data-portrait-edu>大专、本科、硕士、博士...</span>
              </div>
              <div class="portrait-item-row">
                <span class="portrait-label">● 特种作业...</span>
                <span class="portrait-val" data-portrait-license>必须有</span>
              </div>
            </div>

            <!-- 岗位优先要求与权重占比 -->
            <div class="portrait-section">
              <div class="portrait-section-title text-success">
                <span class="portrait-icon">⚡</span> 岗位优先要求（权重比例）
              </div>

              <div class="portrait-priority-row">
                <div class="portrait-priority-meta">
                  <span class="portrait-label">● 职类</span>
                  <span class="portrait-weight-badge">20.00%</span>
                </div>
                <div class="portrait-priority-content" data-portrait-category>风电/光伏运维工程师</div>
              </div>

              <div class="portrait-priority-row">
                <div class="portrait-priority-meta">
                  <span class="portrait-label">● 行业</span>
                  <span class="portrait-weight-badge">10.00%</span>
                </div>
                <div class="portrait-priority-content" data-portrait-industry>风电</div>
              </div>

              <div class="portrait-priority-row">
                <div class="portrait-priority-meta">
                  <span class="portrait-label">● 岗位技能</span>
                  <span class="portrait-weight-badge text-bold">30.00%</span>
                </div>
                <div class="portrait-tags-cloud" data-portrait-skill-tags>
                  <span class="portrait-tag">办公软件</span>
                  <span class="portrait-tag">文字编辑</span>
                  <span class="portrait-tag">office软件</span>
                  <span class="portrait-tag">Offce办公软件</span>
                </div>
              </div>

              <div class="portrait-priority-row">
                <div class="portrait-priority-meta">
                  <span class="portrait-label">● 从业经验</span>
                  <span class="portrait-weight-badge">20.00%</span>
                </div>
                <div class="portrait-priority-content" data-portrait-exp>1-3年相关工作经验</div>
              </div>

              <div class="portrait-priority-row">
                <div class="portrait-priority-meta">
                  <span class="portrait-label">● 其他</span>
                  <span class="portrait-weight-badge">20.00%</span>
                </div>
                <div class="portrait-priority-content" data-portrait-other>能适应项目出差</div>
              </div>
            </div>

            <!-- 搜索关键词标签 -->
            <div class="portrait-section">
              <div class="portrait-section-title text-info">
                <span class="portrait-icon">🔍</span> 搜索关键词
              </div>
              <div class="portrait-tags-cloud" data-portrait-search-tags>
                <span class="portrait-tag is-primary">风力发电</span>
                <span class="portrait-tag is-primary">现场运维</span>
              </div>
            </div>

            <!-- 人机协同决策支持 -->
            <div class="portrait-footer-switch">
              <label class="portrait-switch-label">
                <input type="checkbox" id="chkUsePortraitWeights" checked />
                <span>应用此画像权重与关键词指导简历筛选与搜索</span>
              </label>
            </div>
          </div>
        </div>
      </section>

      <section class="panel job-publish-recent margin-top-lg">
        <div class="section-head">
          <div>
            <h3>最近发布</h3>
            <div class="section-sub">展示最新 5 条 Recruit 岗位及绑定的岗位画像状态。</div>
          </div>
          <div class="hero-actions job-publish-actions">
            <a class="btn btn-secondary" href="./recruit-job-list.html">
              <span class="btn-icon">${PUBLISH_PAGE_ICONS.list}</span>
              查看列表
            </a>
          </div>
        </div>
        <div class="job-recent-list" data-recruit-recent-jobs>
          <div class="table-empty">
            <div class="table-empty-icon">${PUBLISH_PAGE_ICONS.inbox}</div>
            <div class="table-empty-title">岗位数据加载中</div>
            <div class="table-empty-desc">请稍候，正在读取最近发布记录。</div>
          </div>
        </div>
      </section>
      </div>
    `;

    function todayValue() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function renderPortraitView(profile) {
      if (!profile) return;
      currentParsedProfile = profile;
      document.querySelector("[data-portrait-parsed-at]").textContent = `JD解析时间：${profile.parsed_at || "刚刚"}`;
      
      const hard = profile.hard_requirements || {};
      document.querySelector("[data-portrait-age]").textContent = hard.age_range || "16-40岁";
      document.querySelector("[data-portrait-edu]").textContent = hard.education || "不限";
      document.querySelector("[data-portrait-license]").textContent = hard.special_licenses || "无特殊要求";

      const prio = profile.priority_requirements || {};
      if (prio.job_category) document.querySelector("[data-portrait-category]").textContent = prio.job_category.name || "通用岗位";
      if (prio.industry) document.querySelector("[data-portrait-industry]").textContent = prio.industry.name || "通用行业";
      if (prio.experience) document.querySelector("[data-portrait-exp]").textContent = prio.experience.desc || "不限";
      if (prio.other) document.querySelector("[data-portrait-other]").textContent = prio.other.desc || "无";

      const skillTags = (prio.skills && prio.skills.tags) ? prio.skills.tags : [];
      const skillCloud = document.querySelector("[data-portrait-skill-tags]");
      if (skillCloud) {
        skillCloud.innerHTML = skillTags.map(t => `<span class="portrait-tag">${t}</span>`).join("") || '<span class="portrait-tag-empty">暂无关键词</span>';
      }

      const searchTags = profile.search_keywords || [];
      const searchCloud = document.querySelector("[data-portrait-search-tags]");
      if (searchCloud) {
        searchCloud.innerHTML = searchTags.map(t => `<span class="portrait-tag is-primary">${t}</span>`).join("");
      }

      const kwInput = document.querySelector('[data-recruit-field="search_keyword"]');
      if (kwInput && searchTags.length > 0 && !kwInput.value.trim()) {
        kwInput.value = searchTags.slice(0, 3).join(" ");
      }
    }

    async function triggerJDParse() {
      const jdText = document.querySelector('[data-recruit-field="raw_jd_text"]')?.value?.trim();
      const jobTitle = document.querySelector('[data-recruit-field="job_title"]')?.value?.trim();
      if (!jdText) {
        showToast("请先在左侧输入或粘贴 JD 文本");
        return;
      }
      const data = await window.hrApi.parseRecruitJd({ jd_text: jdText, job_title: jobTitle });
      renderPortraitView(data.profile);
      showToast("JD 智能解析成功！岗位画像已更新");
    }

    function readPayload() {
      const get = (name) => document.querySelector(`[data-recruit-field="${name}"]`)?.value?.trim() || "";
      const rawJd = get("raw_jd_text");
      const useWeights = document.getElementById("chkUsePortraitWeights")?.checked ?? true;
      
      let profilePayload = currentParsedProfile;
      if (profilePayload) {
        profilePayload.use_portrait_weights = useWeights;
      }

      return {
        job_title: get("job_title"),
        work_location: get("work_location") || "长春",
        age_min: get("age_min") ? Number(get("age_min")) : null,
        age_max: get("age_max") ? Number(get("age_max")) : null,
        education: get("education") || null,
        candidate_activity: get("candidate_activity") || "1m",
        daily_greet_limit: Number(get("daily_greet_limit") || 20),
        search_keyword: get("search_keyword") || null,
        is_valid: get("is_valid") || "Y",
        raw_jd_text: rawJd || null,
        job_profile: profilePayload || null,
      };
    }

    function renderRecent(jobs) {
      const box = document.querySelector("[data-recruit-recent-jobs]");
      if (!box) return;
      box.innerHTML = jobs.slice(0, 5).map((job) => `
        <div class="job-recent-item">
          <div class="job-recent-copy">
            <div class="job-recent-title">
              ${escapeHtml(job.job_title)}
              ${job.job_profile ? '<span class="import-status-pill tone-primary">含画像</span>' : ''}
            </div>
            <div class="job-recent-meta">${escapeHtml(job.work_location)} · ${job.daily_greet_limit} 次/天 · ${escapeHtml(job.publisher_login || "-")}</div>
          </div>
          <span class="import-status-pill tone-${job.is_valid === "Y" ? "success" : "muted"}">${job.is_valid === "Y" ? "有效" : "跳过"}</span>
        </div>
      `).join("") || `
        <div class="table-empty">
          <div class="table-empty-icon">${PUBLISH_PAGE_ICONS.inbox}</div>
          <div class="table-empty-title">暂无岗位</div>
          <div class="table-empty-desc">发布第一条岗位后，最近记录会显示在这里。</div>
        </div>
      `;
    }

    async function loadPageData() {
      const [jobsResult, statsResult] = await Promise.all([
        window.hrApi.recruitJobPostings(),
        window.hrApi.recruitDailyTaskStats({ date: todayValue() }),
      ]);
      const jobs = jobsResult.jobs || [];
      document.querySelector("[data-recruit-job-total]").textContent = String(jobs.length);
      document.querySelector("[data-recruit-job-valid]").textContent = String(jobs.filter((job) => job.is_valid === "Y").length);
      document.querySelector("[data-recruit-task-today]").textContent = String((statsResult.items || []).length);
      renderRecent(jobs);
    }

    window.addEventListener("DOMContentLoaded", async () => {
      await renderApp();
      await loadPageData().catch((err) => showToast(err.message || String(err)));
      
      document.addEventListener("click", async (event) => {
        const parseBtn = event.target.closest('[data-action="parse-jd"]');
        if (parseBtn) {
          try {
            await window.withButtonBusy(parseBtn, async () => {
              await triggerJDParse();
            }, "解析中...");
          } catch (err) {
            showToast(`解析失败：${err.message || String(err)}`);
          }
          return;
        }

        const submitBtn = event.target.closest('[data-action="submit-recruit-job"]');
        if (submitBtn) {
          try {
            await window.withButtonBusy(submitBtn, async () => {
              const result = await window.hrApi.createRecruitJobPosting(readPayload());
              showToast(`已发布岗位：${result.job.job_title}`);
              document.querySelectorAll("[data-recruit-field]").forEach((node) => {
                if (node.dataset.recruitField === "work_location") node.value = "长春";
                else if (node.dataset.recruitField === "candidate_activity") node.value = "1m";
                else if (node.dataset.recruitField === "daily_greet_limit") node.value = "20";
                else if (node.dataset.recruitField === "is_valid") node.value = "Y";
                else node.value = "";
              });
              currentParsedProfile = null;
              await loadPageData();
            }, "发布中...");
          } catch (err) {
            showToast(`发布失败：${err.message || String(err)}`);
          }
        }
      });
    });
  </script>
</body>
</html>
