<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>评价体系</title>
  <link rel="stylesheet" href="../../styles.css?v=20260719-sidebar-mid" />
  <script defer src="../../frontend-api.js"></script>
  <script defer src="../../app.js?v=20260715-notices-cand-eval-ui"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const EVAL_SEARCH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';
    const EVAL_EMPTY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>';

    window.__PAGE_BODY__ = `
      <div class="evaluations-page">
      <section class="panel eval-card">
        <div class="eval-card-head">
          <div>
            <h3>评价记录</h3>
            <div class="section-sub">查看和搜索候选人面试评价记录</div>
          </div>
          <div class="hero-actions eval-toolbar">
            <div class="input-search">
              <span class="input-search-icon">${EVAL_SEARCH_ICON}</span>
              <input class="input" type="text" placeholder="搜索候选人..." data-eval-filter-search />
            </div>
            <select class="input" data-eval-filter-grade>
              <option value="">全部等级</option>
              <option value="优秀">优秀</option>
              <option value="良好">良好</option>
              <option value="一般">一般</option>
              <option value="较差">较差</option>
              <option value="不合格">不合格</option>
            </select>
          </div>
        </div>

        <div class="table-card">
          <div class="eval-table-head table-head">
            <div>候选人</div>
            <div>关联岗位</div>
            <div>关联轮次</div>
            <div>等级</div>
            <div>分值</div>
            <div>评价内容</div>
            <div>评价人</div>
            <div>评价时间</div>
          </div>
          <div class="list" data-evaluation-list>
            <div class="table-empty">
              <div class="table-empty-icon">${EVAL_EMPTY_ICON}</div>
              <div class="table-empty-title">正在加载数据...</div>
            </div>
          </div>
        </div>
      </section>

      <!-- 新增评价弹窗 -->
      <div class="modal" data-evaluation-modal style="display:none; position:fixed; inset:0; background:rgba(14,22,34,.45); z-index:2000; padding:24px; overflow-y:auto;">
        <div class="panel" style="max-width:760px; margin:6vh auto 0; background:#fff; position:relative; padding-bottom:80px; border-radius:12px; overflow:hidden;">
          <div class="section-head" style="border-bottom:1px solid #f1f5f9; padding-bottom:16px; margin-bottom:24px;">
            <div>
              <h3 style="margin:0;">新增评价</h3>
              <div class="section-sub">选择候选人、对应岗位及面试轮次，填写评分与评语。</div>
            </div>
            <div class="hero-actions" style="margin-top:0">
              <button class="btn" style="border:none; background:transparent; font-size:18px; color:#94a3b8; padding:4px;" data-action="close-evaluation-modal">×</button>
            </div>
          </div>
          <div class="grid-2" style="gap:24px;">
            <div class="list-item" style="border:none; padding:0;">
              <div class="item-title" style="margin-bottom:8px; color:#475569; font-size:13px;">候选人 <span style="color:#ef4444">*</span></div>
              <select class="input" data-eval-candidate style="width:100%; height:40px; border-radius:8px;"></select>
            </div>
            <div class="list-item" style="border:none; padding:0;">
              <div class="item-title" style="margin-bottom:8px; color:#475569; font-size:13px;">岗位 <span style="color:#ef4444">*</span></div>
              <select class="input" data-eval-position style="width:100%; height:40px; border-radius:8px;"></select>
            </div>
            <div class="list-item" style="border:none; padding:0;">
              <div class="item-title" style="margin-bottom:8px; color:#475569; font-size:13px;">轮次</div>
              <input class="input" data-eval-round placeholder="第 1 轮" style="width:100%; height:40px; border-radius:8px;" />
            </div>
            <div class="list-item" style="border:none; padding:0;">
              <div class="item-title" style="margin-bottom:8px; color:#475569; font-size:13px;">评价等级</div>
              <select class="input" data-eval-grade style="width:100%; height:40px; border-radius:8px;">
                <option value="优秀" data-score="5">优秀</option>
                <option value="良好" data-score="4" selected>良好</option>
                <option value="一般" data-score="3">一般</option>
                <option value="较差" data-score="2">较差</option>
                <option value="不合格" data-score="1">不合格</option>
              </select>
            </div>
            <div class="list-item" style="border:none; padding:0;">
              <div class="item-title" style="margin-bottom:8px; color:#475569; font-size:13px;">评分 (1 - 5分)</div>
              <input class="input" type="number" min="1" max="5" value="4" data-eval-score style="width:100%; height:40px; border-radius:8px;" />
            </div>
          </div>
          
          <div style="margin-top:24px;">
            <div class="item-title" style="margin-bottom:8px; color:#475569; font-size:13px;">评语备注</div>
            <textarea class="input" rows="4" data-eval-content placeholder="请输入具体的面试表现或评价评语" style="width:100%; border-radius:8px; padding:10px 12px; font-family:inherit;"></textarea>
          </div>

          <div style="position:absolute; bottom:0; left:0; right:0; padding:16px 24px; background:#fff; border-top:1px solid #e2e8f0; display:flex; justify-content:flex-end; gap:12px;">
            <button class="btn" data-action="close-evaluation-modal" style="border-radius:20px; padding:0 24px; height:36px; border:1px solid #cbd5e1; color:#64748b; background:#fff; font-size:14px; cursor:pointer;">取消</button>
            <button class="btn primary" data-action="confirm-evaluation-upload" style="border-radius:20px; padding:0 24px; height:36px; background:#8b5cf6; border:none; font-size:14px; color:#fff; cursor:pointer;">确认保存</button>
          </div>
        </div>
      </div>
      </div>
    `;

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function evalGradeTone(grade) {
      if (grade === '优秀') return 'success';
      if (grade === '良好') return 'info';
      if (grade === '一般') return 'neutral';
      return 'warning';
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await renderApp();
      
      document.addEventListener('change', (event) => {
        const select = event.target.closest('[data-eval-grade]');
        if (!select) return;
        const score = Number(select.selectedOptions[0]?.dataset.score || 0);
        const scoreInput = document.querySelector('[data-eval-score]');
        if (scoreInput && score) scoreInput.value = String(score);
      });

      const searchInput = document.querySelector('[data-eval-filter-search]');
      const gradeSelect = document.querySelector('[data-eval-filter-grade]');

      if (searchInput) searchInput.addEventListener('input', () => window.renderEvaluationList());
      if (gradeSelect) gradeSelect.addEventListener('change', () => window.renderEvaluationList());

      try {
        const candidates = await window.hrApi.candidates();
        const positions = await window.hrApi.positions();
        const items = await window.hrApi.evaluations();
        const levels = await window.hrApi.evaluationLevels();
        
        window.evaluationData = { candidates, positions, items, levels };
        
        window.renderEvaluationList = function() {
          const { candidates, positions, items } = window.evaluationData;
          
          const searchVal = searchInput?.value.trim().toLowerCase() || '';
          const gradeVal = gradeSelect?.value || '';

          let displayItems = [...items];

          if (searchVal) {
            displayItems = displayItems.filter(i => {
              const candidate = candidates.find(c => c.id === i.candidate_id);
              return candidate?.name?.toLowerCase().includes(searchVal);
            });
          }

          if (gradeVal) {
            displayItems = displayItems.filter(i => i.grade === gradeVal);
          }

          const list = document.querySelector('[data-evaluation-list]');
          if (list) {
            if (displayItems.length === 0) {
              list.innerHTML = `
                <div class="table-empty">
                  <div class="table-empty-icon">${EVAL_EMPTY_ICON}</div>
                  <div class="table-empty-title">暂无评价记录</div>
                  <div class="table-empty-desc">调整筛选条件或稍后再查看。</div>
                </div>
              `;
              return;
            }

            list.innerHTML = displayItems.map(i => {
              const candidate = candidates.find(c => c.id === i.candidate_id);
              const position = positions.find(p => p.id === i.position_id);
              const dateStr = i.created_at ? i.created_at.split('T')[0] : '--';
              const content = String(i.content || '').trim();
              const contentHtml = content
                ? escapeHtml(content)
                : '<span class="eval-content-empty">无评语</span>';
              
              return `
                <div class="eval-table-row table-row">
                  <div class="eval-name">${escapeHtml(candidate?.name || `候选人 ${i.candidate_id}`)}</div>
                  <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${escapeHtml(position?.name || '')}">${escapeHtml(position?.name || `岗位 ${i.position_id || '--'}`)}</div>
                  <div>${escapeHtml(i.round_name || '--')}</div>
                  <div><span class="eval-grade-pill tone-${evalGradeTone(i.grade)}">${escapeHtml(i.grade)}</span></div>
                  <div><span class="eval-score">${escapeHtml(String(i.score ?? '--'))}</span><span class="eval-score-unit">分</span></div>
                  <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${escapeHtml(content)}">${contentHtml}</div>
                  <div class="eval-muted">${escapeHtml(i.evaluator || '--')}</div>
                  <div class="eval-muted">${dateStr}</div>
                </div>
              `;
            }).join('');
          }
        };
        
        window.renderEvaluationList();
      } catch (err) {
        console.warn(err);
      }
    });
  </script>
</body>
</html>
