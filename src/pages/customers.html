  <div class="modal" data-project-edit-modal style="display:none; position:fixed; inset:0; background:rgba(14,22,34,.45); z-index:2000; padding:24px; overflow-y:auto;">

            <div class="list-item"><div class="item-top"><div><div class="item-title">状态</div></div></div><select class="input" data-project-edit-status><option value="招聘中">招聘中</option><option value="招聘完毕">招聘完毕</option><option value="招聘中止">招聘中止</option></select></div>
            <div class="list-item"><div class="item-top"><div><div class="item-title">级别</div></div></div><select class="input" data-project-edit-level><option value="高">高</option><option value="中">中</option><option value="低">低</option></select></div>

            <div class="list-item"><div class="item-top"><div><div class="item-title">最高薪资</div></div></div><input class="input" type="number" min="0" data-position-edit-salary-max /></div>

    window.addEventListener('DOMContentLoaded', async () => {
      await renderApp();
      try {
        const [companies, projects, positions, employmentRecords, tagConfigs] = await Promise.all([
          window.hrApi.companies(),
          window.hrApi.projects(),
          window.hrApi.positions(),
          window.hrApi.employmentRecords(),
          window.hrTagSystem?.fetchConfigs?.() || Promise.resolve([]),
        ]);
        document.querySelector('[data-company-total]').textContent = String(companies.length);
        document.querySelector('[data-company-projects]').textContent = String(projects.filter(project => project.status === '招聘中').length);
        document.querySelector('[data-company-delivery]').textContent = String(employmentRecords.length);
        document.querySelector('[data-company-positions]').textContent = String(companies.reduce((sum, company) => sum + (company.position_count || 0), 0));

        // 项目列表「所属公司」下钻：?company_id= 只展示该公司
        const companyId = new URLSearchParams(location.search).get('company_id');
        const filteredCompanies = companyId
          ? companies.filter((company) => String(company.id) === String(companyId))
          : companies;
        const list = document.querySelector('[data-company-list]');
        if (list) {
          list.innerHTML = window.hrRenderCompanyList
            ? window.hrRenderCompanyList(filteredCompanies, projects, positions, tagConfigs)
            : '';
        }
        const panelHead = document.querySelector('.customers-panel .section-head');
        const subtitle = panelHead?.querySelector('.section-sub');
        const headTitle = panelHead?.querySelector('h3');
        if (companyId && filteredCompanies.length) {
          const name = filteredCompanies[0].name || '指定客户';
          if (headTitle) headTitle.textContent = `客户公司 · ${name}`;
          if (subtitle) {
            subtitle.innerHTML = `已按项目列表下钻过滤。<a class="customer-inline-link" href="./customers.html">查看全部客户</a>`;
          }
        } else if (companyId && !filteredCompanies.length) {
          if (subtitle) {
            subtitle.innerHTML = `未找到对应客户。<a class="customer-inline-link" href="./customers.html">查看全部客户</a>`;
          }
        }
      } catch (err) {
        console.warn(err);
      }
    });
</script>

        </div>
      </div>
      <div data-position-candidates-list>暂无数据</div>
    </div>
