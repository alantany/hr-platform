<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通知提醒</title>
  <link rel="stylesheet" href="../../styles.css?v=20260720-logo-prev" />
  <script defer src="../../frontend-api.js"></script>
  <script defer src="../../app.js?v=20260720-logo-prev"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const escapeTaskText = (value) => String(value ?? '')
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    const CHEVRON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';
    const NOTICE_ICONS = {
      bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>',
      tags: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
      link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
    };

    const taskStatusMap = {
      pending: ['待确认', 'warning'],
      accepted: ['已接受', 'success'],
      rejected: ['已拒绝', 'danger'],
      revoked: ['已撤回', 'neutral'],
    };

    const renderTaskRows = (items) => items.map((item) => {
      const [statusLabel, statusTone] = taskStatusMap[item.status] || [item.status, 'neutral'];
      const canRespond = item.status === 'pending' && Number(item.assignee_user_id) === Number(state.currentUser?.id);
      const responseMeta = item.response_note ? `<div class="item-meta">处理说明：${escapeTaskText(item.response_note)}</div>` : '';
      return `
        <div class="notice-list-item task-item ${item.status === 'pending' ? 'is-pending' : ''}">
          <div class="notice-list-main">
            <div class="notice-list-title">${escapeTaskText(item.position_name)}</div>
            <div class="notice-list-meta">${escapeTaskText(item.project_name || '未关联项目')} · ${escapeTaskText(item.assigned_by_name)} 分配给 ${escapeTaskText(item.assignee_name)}</div>
            <div class="notice-list-time">${escapeTaskText(item.created_at || '')}</div>
            ${responseMeta}
          </div>
          <div class="notice-list-side">
            <span class="status-pill tone-${statusTone}">${statusLabel}</span>
            ${canRespond ? `
              <button class="btn-sm primary" data-action="accept-position-task" data-id="${item.id}">接受</button>
              <button class="btn-sm btn-secondary" data-action="reject-position-task" data-id="${item.id}">拒绝</button>
            ` : ''}
          </div>
        </div>
      `;
    }).join('');

    const renderRows = (items) => items.map((item) => `
      <div class="notice-list-item notice-item ${item.read ? 'is-read' : 'is-unread'}">
        <div class="notice-list-main">
          <div class="notice-list-title">${escapeTaskText(item.title)}</div>
          <div class="notice-list-meta">${escapeTaskText(item.type || '通知')} · ${escapeTaskText(item.user || '')}</div>
          <div class="notice-list-time">${escapeTaskText(item.created_at || '')}</div>
        </div>
        <div class="notice-list-side">
          ${item.read
            ? `<span class="read-pill is-read">已读</span>`
            : `<button class="read-pill is-unread" type="button" data-action="read-notification" data-id="${item.id}">未读</button>`
          }
        </div>
      </div>
    `).join('');

    const state = { items: [], tasks: [], currentUser: null };

    function readFilter(selector) {
      return document.querySelector(selector)?.value?.trim?.() || '';
    }

    function buildParams() {
      const params = {};
      const type = readFilter('[data-notice-type]');
      const read = readFilter('[data-notice-read]');
      const keyword = readFilter('[data-notice-keyword]');
      const from = readFilter('[data-notice-from]');
      const to = readFilter('[data-notice-to]');
      if (type) params.type = type;
      if (read === 'true') params.read = 'true';
      if (read === 'false') params.read = 'false';
      if (keyword) params.keyword = keyword;
      if (from) params.date_from = from;
      if (to) params.date_to = to;
      return params;
    }

    async function loadNotifications() {
      const items = await window.hrApi.notifications(buildParams());
      state.items = items;
      document.querySelector('[data-notice-total]').textContent = String(items.length);
      const unreadAll = await window.hrApi.notifications({ read: false });
      const unreadEl = document.querySelector('[data-notice-unread]');
      if (unreadEl) {
        unreadEl.textContent = String(unreadAll.length);
        unreadEl.classList.toggle('is-urgent', unreadAll.length > 0);
        unreadEl.classList.toggle('is-zero', unreadAll.length === 0);
      }
      document.querySelector('[data-notice-types]').textContent = String(new Set(items.map((item) => item.type || '通知')).size);
      document.querySelector('[data-notification-list]').innerHTML = items.length
        ? renderRows(items)
        : '<div class="table-empty"><div class="table-empty-title">当前筛选条件下没有通知</div><div class="table-empty-desc">可调整类型、已读状态或时间范围后再试。</div></div>';
      if (typeof window.updateTopNoticeBadge === 'function') {
        window.updateTopNoticeBadge(unreadAll.length);
      } else if (typeof window.refreshTopNoticeBadge === 'function') {
        await window.refreshTopNoticeBadge();
      }
    }
    window.loadNotifications = loadNotifications;

    async function loadPositionTasks() {
      const tasks = await window.hrApi.positionAssignmentTasks();
      state.tasks = tasks;
      const pending = tasks.filter((item) => item.status === 'pending');
      document.querySelector('[data-position-task-count]').textContent = String(pending.length);
      document.querySelector('[data-position-task-list]').innerHTML = tasks.length
        ? renderTaskRows(tasks)
        : '<div class="table-empty"><div class="table-empty-title">当前没有岗位分配任务</div><div class="table-empty-desc">有新分配时会显示在这里。</div></div>';
    }

    window.__PAGE_BODY__ = `
      <div class="notices-page">
      <section class="panel task-board-panel is-collapsed" id="position-tasks" data-position-task-section data-collapsible-panel>
        <div class="section-head task-board-panel-head">
          <button type="button" class="task-board-toggle" data-action="toggle-task-panel" aria-expanded="false">
            <span class="task-board-toggle-icon" aria-hidden="true">${CHEVRON_SVG}</span>
            <span>
              <h3>岗位分配待办 <span class="count-pill" data-position-task-count>0</span></h3>
              <div class="section-sub">操作员在这里接受或拒绝组长分配的岗位；组长可以查看处理结果。</div>
            </span>
          </button>
          <button class="btn btn-secondary" type="button" data-action="refresh-position-tasks">刷新</button>
        </div>
        <div class="task-board-panel-body" data-position-task-body hidden>
          <div class="notice-list" data-position-task-list>
            <div class="table-empty"><div class="table-empty-title">加载中...</div></div>
          </div>
        </div>
      </section>

      <section class="metrics">
        <div class="metric-card tone-primary" data-metric-filter-group="notice-metric" data-metric-filter-key="" onclick="filterNotices('')" style="cursor:pointer;">
          <div class="metric-top"><div><div class="section-sub">通知总数</div></div><div class="metric-icon">${NOTICE_ICONS.bell}</div></div>
          <div class="metric-value" data-notice-total>0</div>
        </div>
        <div class="metric-card tone-danger" data-metric-filter-group="notice-metric" data-metric-filter-key="false" onclick="filterNotices('false')" style="cursor:pointer;">
          <div class="metric-top"><div><div class="section-sub">未读通知</div></div><div class="metric-icon">${NOTICE_ICONS.alert}</div></div>
          <div class="metric-value is-zero" data-notice-unread>0</div>
        </div>
        <div class="metric-card tone-warning">
          <div class="metric-top"><div><div class="section-sub">通知类型</div></div><div class="metric-icon">${NOTICE_ICONS.tags}</div></div>
          <div class="metric-value" data-notice-types>0</div>
        </div>
        <div class="metric-card tone-success">
          <div class="metric-top"><div><div class="section-sub">跳转目标</div></div><div class="metric-icon">${NOTICE_ICONS.link}</div></div>
          <div class="metric-value is-direct">直达</div>
        </div>
      </section>

      <section class="panel task-board-panel is-collapsed" data-notification-section data-collapsible-panel>
        <div class="section-head task-board-panel-head">
          <button type="button" class="task-board-toggle" data-action="toggle-task-panel" aria-expanded="false">
            <span class="task-board-toggle-icon" aria-hidden="true">${CHEVRON_SVG}</span>
            <span>
              <h3>通知列表</h3>
              <div class="section-sub">监控导入、审批与系统事件等站内通知。</div>
            </span>
          </button>
          <div class="hero-actions notices-actions">
            <button class="btn btn-secondary" type="button" data-action="refresh-notifications">刷新</button>
          </div>
        </div>

        <div class="task-board-panel-body" data-notification-body hidden>
          <div class="notice-filters-bar">
            <label class="notice-filter-field">
              <span>通知类型</span>
              <input class="input" data-notice-type placeholder="例如 导入" />
            </label>
            <label class="notice-filter-field">
              <span>已读状态</span>
              <select class="input" data-notice-read>
                <option value="">全部</option>
                <option value="false">未读</option>
                <option value="true">已读</option>
              </select>
            </label>
            <label class="notice-filter-field is-grow">
              <span>关键词</span>
              <input class="input" data-notice-keyword placeholder="例如 简历导入" />
            </label>
            <label class="notice-filter-field">
              <span>时间范围</span>
              <div class="notice-date-range">
                <input class="input" type="date" data-notice-from />
                <span>至</span>
                <input class="input" type="date" data-notice-to />
              </div>
            </label>
          </div>
          <div class="notice-list" data-notification-list>
            <div class="table-empty"><div class="table-empty-title">加载中...</div></div>
          </div>
        </div>
      </section>
      </div>
    `;

    function setPanelCollapsed(panel, collapsed) {
      if (!panel) return;
      const body = panel.querySelector('.task-board-panel-body');
      const toggle = panel.querySelector('[data-action="toggle-task-panel"]');
      panel.classList.toggle('is-collapsed', collapsed);
      panel.classList.toggle('is-expanded', !collapsed);
      if (body) body.hidden = collapsed;
      if (toggle) toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await renderApp();
      state.currentUser = window.currentUser || await window.hrApi.me();
      await loadPositionTasks().catch((err) => {
        const list = document.querySelector('[data-position-task-list]');
        if (list) list.innerHTML = `<div class="table-empty"><div class="table-empty-title">加载失败</div><div class="table-empty-desc">${escapeTaskText(err.message || err)}</div></div>`;
      });
      await loadNotifications().catch((err) => {
        const list = document.querySelector('[data-notification-list]');
        if (list) list.innerHTML = `<div class="table-empty"><div class="table-empty-title">加载失败</div><div class="table-empty-desc">${escapeTaskText(err.message || err)}</div></div>`;
      });
      document.querySelectorAll('[data-collapsible-panel]').forEach((panel) => setPanelCollapsed(panel, true));
      if (new URLSearchParams(location.search).get('tab') === 'position-tasks') {
        const taskPanel = document.querySelector('[data-position-task-section]');
        setPanelCollapsed(taskPanel, false);
        taskPanel?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });

    // SPA 每次进入本页会重跑脚本；挂载前卸掉旧监听，避免刷新 toast 叠加
    if (window.__notificationsPageClickHandler) {
      document.removeEventListener('click', window.__notificationsPageClickHandler);
    }
    if (window.__notificationsPageInputHandler) {
      document.removeEventListener('input', window.__notificationsPageInputHandler);
    }
    if (window.__notificationsPageChangeHandler) {
      document.removeEventListener('change', window.__notificationsPageChangeHandler);
    }

    window.__notificationsPageClickHandler = async (event) => {
      const btn = event.target.closest('[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'toggle-task-panel') return;
      if (btn.dataset.action === 'refresh-notifications') {
        await loadNotifications().catch((err) => console.warn(err));
        showToast('通知已刷新');
        return;
      }
      if (btn.dataset.action === 'refresh-position-tasks') {
        await loadPositionTasks();
        showToast('岗位待办已刷新');
        return;
      }
      if (btn.dataset.action === 'accept-position-task') {
        await window.hrApi.respondPositionAssignmentTask(btn.dataset.id, 'accept');
        await Promise.all([loadPositionTasks(), loadNotifications()]);
        showToast('已接受岗位分配，岗位权限已生效');
        return;
      }
      if (btn.dataset.action === 'reject-position-task') {
        const note = window.prompt('可填写拒绝原因（选填）', '') ?? null;
        if (note === null) return;
        await window.hrApi.respondPositionAssignmentTask(btn.dataset.id, 'reject', note);
        await Promise.all([loadPositionTasks(), loadNotifications()]);
        showToast('已拒绝岗位分配');
        return;
      }
      if (btn.dataset.action === 'read-notification') {
        try {
          await window.hrApi.readNotification(btn.dataset.id);
          await loadNotifications();
        } catch (err) {
          console.warn(err);
        }
      }
    };
    document.addEventListener('click', window.__notificationsPageClickHandler);

    let timer = null;
    window.__notificationsPageInputHandler = (event) => {
      if (!event.target.closest('[data-notice-type], [data-notice-keyword]')) return;
      clearTimeout(timer);
      timer = setTimeout(() => loadNotifications().catch((err) => console.warn(err)), 250);
    };
    document.addEventListener('input', window.__notificationsPageInputHandler);

    window.__notificationsPageChangeHandler = (event) => {
      if (!event.target.closest('[data-notice-read], [data-notice-from], [data-notice-to]')) return;
      loadNotifications().catch((err) => console.warn(err));
    };
    document.addEventListener('change', window.__notificationsPageChangeHandler);

    window.filterNotices = function(read) {
      const applied = window.applyMetricFilterToggle
        ? window.applyMetricFilterToggle('notice-metric', read || '', '')
        : (read || '');
      const readSelect = document.querySelector('[data-notice-read]');
      if (readSelect) readSelect.value = applied || '';
      if (window.loadNotifications) {
        window.loadNotifications().catch((err) => console.warn(err));
      }
    };
  </script>
</body>
</html>
