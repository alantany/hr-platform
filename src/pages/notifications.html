<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通知提醒</title>
  <link rel="stylesheet" href="../../styles.css" />
  <script defer src="../../frontend-api.js"></script>
  <script defer src="../../app.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const escapeTaskText = (value) => String(value ?? '')
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    const taskStatusMap = {
      pending: ['待确认', 'warning'],
      accepted: ['已接受', 'success'],
      rejected: ['已拒绝', 'danger'],
      revoked: ['已撤回', 'neutral'],
    };

    const renderTaskRows = (items) => items.map((item) => {
      const [statusLabel, statusTone] = taskStatusMap[item.status] || [item.status, 'neutral'];
      const canRespond = item.status === 'pending' && Number(item.assignee_user_id) === Number(state.currentUser?.id);
      const responseMeta = item.response_note ? `<div class="item-meta">处理说明：${escapeTaskText(item.response_note)}</div>` : '';
      return `
        <div class="list-item ${item.status === 'pending' ? 'soft' : ''}">
          <div class="item-top">
            <div>
              <div class="item-title">${escapeTaskText(item.position_name)}</div>
              <div class="item-meta">${escapeTaskText(item.project_name || '未关联项目')} · ${escapeTaskText(item.assigned_by_name)} 分配给 ${escapeTaskText(item.assignee_name)}</div>
              <div class="item-meta mono">${escapeTaskText(item.created_at || '')}</div>
              ${responseMeta}
            </div>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
              <span class="chip ${statusTone}">${statusLabel}</span>
              ${canRespond ? `
                <button class="btn-sm primary" data-action="accept-position-task" data-id="${item.id}">接受</button>
                <button class="btn-sm" data-action="reject-position-task" data-id="${item.id}">拒绝</button>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');

    const renderRows = (items) => items.map((item) => `
      <div class="list-item ${item.read ? '' : 'soft'}">
        <div class="item-top">
          <div>
            <div class="item-title">${item.title}</div>
            <div class="item-meta">${item.type || '通知'} · ${item.user || ''}</div>
            <div class="item-meta mono">${item.created_at || ''}</div>
          </div>
          <div style="display:flex; gap:8px; align-items:center;">
            ${item.read 
              ? `<span class="chip neutral" style="min-width: 60px; text-align: center; display: inline-block;">已读</span>` 
              : `<button class="btn-sm primary" data-action="read-notification" data-id="${item.id}" style="min-width: 60px; height: 28px; line-height: 28px; padding: 0 10px; font-size: 12px; font-weight: 500;">未读</button>`
            }
          </div>
        </div>
      </div>
    `).join('');

    const state = { items: [], tasks: [], currentUser: null };

    function readFilter(selector) {
      return document.querySelector(selector)?.value?.trim?.() || '';
    }

    function buildParams() {
      const params = {};
      const type = readFilter('[data-notice-type]');
      const read = readFilter('[data-notice-read]');
      const keyword = readFilter('[data-notice-keyword]');
      const from = readFilter('[data-notice-from]');
      const to = readFilter('[data-notice-to]');
      if (type) params.type = type;
      if (read === 'true') params.read = 'true';
      if (read === 'false') params.read = 'false';
      if (keyword) params.keyword = keyword;
      if (from) params.date_from = from;
      if (to) params.date_to = to;
      return params;
    }

    async function loadNotifications() {
      const items = await window.hrApi.notifications(buildParams());
      state.items = items;
      document.querySelector('[data-notice-total]').textContent = String(items.length);
      document.querySelector('[data-notice-unread]').textContent = String(items.filter((item) => !item.read).length);
      document.querySelector('[data-notice-types]').textContent = String(new Set(items.map((item) => item.type || '通知')).size);
      document.querySelector('[data-notification-list]').innerHTML = items.length ? renderRows(items) : '<div class="list-item"><div class="item-meta">当前筛选条件下没有通知。</div></div>';
    }

    async function loadPositionTasks() {
      const tasks = await window.hrApi.positionAssignmentTasks();
      state.tasks = tasks;
      const pending = tasks.filter((item) => item.status === 'pending');
      document.querySelector('[data-position-task-count]').textContent = String(pending.length);
      document.querySelector('[data-position-task-list]').innerHTML = tasks.length
        ? renderTaskRows(tasks)
        : '<div class="list-item"><div class="item-meta">当前没有岗位分配任务。</div></div>';
    }

    window.__PAGE_BODY__ = `
      <section class="panel task-board-panel is-collapsed" id="position-tasks" data-position-task-section data-collapsible-panel>
        <div class="section-head task-board-panel-head">
          <button type="button" class="task-board-toggle" data-action="toggle-task-panel" aria-expanded="false">
            <span class="task-board-toggle-icon" aria-hidden="true">▸</span>
            <span>
              <h3>岗位分配待办 <span class="chip warning" data-position-task-count>0</span></h3>
              <div class="section-sub">操作员在这里接受或拒绝组长分配的岗位；组长可以查看处理结果。默认折叠，点击展开。</div>
            </span>
          </button>
          <button class="btn secondary" data-action="refresh-position-tasks">刷新</button>
        </div>
        <div class="task-board-panel-body" data-position-task-body hidden>
          <div class="list" data-position-task-list>
            <div class="list-item"><div class="item-meta">加载中...</div></div>
          </div>
        </div>
      </section>
      <section class="metrics">
        <div class="metric-card tone-primary" onclick="filterNotices('', null)" style="cursor: pointer;"><div class="metric-top"><div><div class="section-sub">通知总数</div></div><div class="metric-icon">○</div></div><div class="metric-value" data-notice-total>0</div><div class="metric-label">当前筛选结果</div></div>
        <div class="metric-card tone-danger" onclick="filterNotices('false', null)" style="cursor: pointer;"><div class="metric-top"><div><div class="section-sub">未读通知</div></div><div class="metric-icon">△</div></div><div class="metric-value" data-notice-unread>0</div><div class="metric-label">需要处理的消息</div></div>
        <div class="metric-card tone-warning"><div class="metric-top"><div><div class="section-sub">通知类型</div></div><div class="metric-icon">▣</div></div><div class="metric-value" data-notice-types>0</div><div class="metric-label">导入 / 项目 / 评价 / 质保 / 系统</div></div>
        <div class="metric-card tone-success"><div class="metric-top"><div><div class="section-sub">跳转目标</div></div><div class="metric-icon">◌</div></div><div class="metric-value">直达</div><div class="metric-label">点击可回到业务页面</div></div>
      </section>
      <section class="panel task-board-panel is-collapsed" data-notification-section data-collapsible-panel>
        <div class="section-head task-board-panel-head">
          <button type="button" class="task-board-toggle" data-action="toggle-task-panel" aria-expanded="false">
            <span class="task-board-toggle-icon" aria-hidden="true">▸</span>
            <span>
              <h3>通知列表</h3>
              <div class="section-sub">实时监控系统内发生的信息推进、导入、审批、操作流等重要通知。默认折叠，点击展开。</div>
            </span>
          </button>
          <div class="hero-actions" style="margin-top:0">
            <button class="btn secondary" data-action="refresh-notifications">刷新</button>
          </div>
        </div>

        <div class="task-board-panel-body" data-notification-body hidden>
          <!-- 紧凑的单行过滤器 -->
          <div class="notice-filters-bar" style="display: flex; flex-wrap: nowrap; gap: 12px; align-items: center; padding: 12px 16px; background: rgba(15,23,42,.02); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow-x: auto;">
            <div class="filter-item" style="display: flex; align-items: center; gap: 8px;">
              <span class="filter-label" style="font-size: 13px; color: var(--muted-foreground); white-space: nowrap;">通知类型:</span>
              <input class="input" data-notice-type placeholder="例如 导入" style="width: 100px; height: 32px; padding: 0 8px; font-size: 13px;" />
            </div>
            <div class="filter-item" style="display: flex; align-items: center; gap: 8px;">
              <span class="filter-label" style="font-size: 13px; color: var(--muted-foreground); white-space: nowrap;">已读状态:</span>
              <select class="input" data-notice-read style="width: 90px; height: 32px; padding: 0 8px; font-size: 13px;">
                <option value="">全部</option>
                <option value="false">未读</option>
                <option value="true">已读</option>
              </select>
            </div>
            <div class="filter-item" style="display: flex; align-items: center; gap: 8px;">
              <span class="filter-label" style="font-size: 13px; color: var(--muted-foreground); white-space: nowrap;">关键词:</span>
              <input class="input" data-notice-keyword placeholder="例如 简历导入" style="width: 130px; height: 32px; padding: 0 8px; font-size: 13px;" />
            </div>
            <div class="filter-item" style="display: flex; align-items: center; gap: 8px; margin-left: auto;">
              <span class="filter-label" style="font-size: 13px; color: var(--muted-foreground); white-space: nowrap;">时间范围:</span>
              <input class="input" type="date" data-notice-from style="width: 120px; height: 32px; padding: 0 8px; font-size: 13px;" />
              <span style="font-size: 13px; color: var(--muted-foreground);">至</span>
              <input class="input" type="date" data-notice-to style="width: 120px; height: 32px; padding: 0 8px; font-size: 13px;" />
            </div>
          </div>

          <!-- 独占宽度的通知列表 -->
          <div class="panel" style="box-shadow:none; border:1px solid rgba(15,23,42,.08); padding:16px; margin:0;">
            <div class="list" data-notification-list>
              <div class="list-item"><div class="item-meta">加载中...</div></div>
            </div>
          </div>
        </div>
      </section>
    `;

    function setPanelCollapsed(panel, collapsed) {
      if (!panel) return;
      const body = panel.querySelector('.task-board-panel-body');
      const toggle = panel.querySelector('[data-action="toggle-task-panel"]');
      const icon = panel.querySelector('.task-board-toggle-icon');
      panel.classList.toggle('is-collapsed', collapsed);
      panel.classList.toggle('is-expanded', !collapsed);
      if (body) body.hidden = collapsed;
      if (toggle) toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      if (icon) icon.textContent = collapsed ? '▸' : '▾';
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await renderApp();
      state.currentUser = window.currentUser || await window.hrApi.me();
      await loadPositionTasks().catch((err) => {
        const list = document.querySelector('[data-position-task-list]');
        if (list) list.innerHTML = `<div class="list-item"><div class="item-meta">加载失败：${escapeTaskText(err.message || err)}</div></div>`;
      });
      await loadNotifications().catch((err) => {
        const list = document.querySelector('[data-notification-list]');
        if (list) list.innerHTML = `<div class="list-item"><div class="item-meta">加载失败：${err.message || err}</div></div>`;
      });
      // 默认折叠；从首页待办跳转时自动展开岗位分配待办
      document.querySelectorAll('[data-collapsible-panel]').forEach((panel) => setPanelCollapsed(panel, true));
      if (new URLSearchParams(location.search).get('tab') === 'position-tasks') {
        const taskPanel = document.querySelector('[data-position-task-section]');
        setPanelCollapsed(taskPanel, false);
        taskPanel?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });

    document.addEventListener('click', async (event) => {
      const btn = event.target.closest('[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'toggle-task-panel') {
        const panel = btn.closest('[data-collapsible-panel]');
        const collapsed = !panel?.classList.contains('is-collapsed');
        setPanelCollapsed(panel, collapsed);
        return;
      }
      if (btn.dataset.action === 'refresh-notifications') {
        await loadNotifications().catch((err) => console.warn(err));
        showToast('通知已刷新');
      }
      if (btn.dataset.action === 'refresh-position-tasks') {
        await loadPositionTasks();
        showToast('岗位待办已刷新');
      }
      if (btn.dataset.action === 'accept-position-task') {
        await window.hrApi.respondPositionAssignmentTask(btn.dataset.id, 'accept');
        await Promise.all([loadPositionTasks(), loadNotifications()]);
        showToast('已接受岗位分配，岗位权限已生效');
      }
      if (btn.dataset.action === 'reject-position-task') {
        const note = window.prompt('可填写拒绝原因（选填）', '') ?? null;
        if (note === null) return;
        await window.hrApi.respondPositionAssignmentTask(btn.dataset.id, 'reject', note);
        await Promise.all([loadPositionTasks(), loadNotifications()]);
        showToast('已拒绝岗位分配');
      }
      if (btn.dataset.action === 'read-notification') {
        try {
          await window.hrApi.readNotification(btn.dataset.id);
          await loadNotifications();
        } catch (err) {
          console.warn(err);
        }
      }
    });

    let timer = null;
    document.addEventListener('input', (event) => {
      if (!event.target.closest('[data-notice-type], [data-notice-keyword]')) return;
      clearTimeout(timer);
      timer = setTimeout(() => loadNotifications().catch((err) => console.warn(err)), 250);
    });

    document.addEventListener('change', (event) => {
      if (!event.target.closest('[data-notice-read], [data-notice-from], [data-notice-to]')) return;
      loadNotifications().catch((err) => console.warn(err));
    });

    window.filterNotices = function(read, type) {
      const readSelect = document.querySelector('[data-notice-read]');
      if (readSelect) {
        readSelect.value = read !== null && read !== undefined ? String(read) : '';
      }
      const typeInput = document.querySelector('[data-notice-type]');
      if (typeInput) {
        typeInput.value = type || '';
      }
      if (window.loadNotifications) {
        window.loadNotifications().catch((err) => console.warn(err));
      }
    };
  </script>
</body>
</html>
